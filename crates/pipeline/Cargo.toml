[package]
name = "gtfs-pipeline"
version = "0.6.0"
edition = "2021"
license.workspace = true

[dependencies]
gtfs-core = { path = "../core" }
gtfs-rules = { path = "../rules" }
gtfs-config = { path = "../config" }
serde = { workspace = true }
serde_json = { workspace = true }
zip = { workspace = true }
chrono-tz = "0.10"
smol_str = "0.2"
url = "2"
rustc-hash = "2"
rayon = { version = "1", optional = true }

[features]
# K6 check'lerini iş-parçacıkları arası paralel çalıştırır (native: gerçek threadler).
# Çıktı seri ile BİREBİR (renumber + kanonik birleştirme). WASM'da ayrı thread kurulumu gerekir.
parallel = ["dep:rayon"]

[target.'cfg(target_family = "wasm")'.dependencies]
web-sys = { version = "0.3", features = ["console"] }
