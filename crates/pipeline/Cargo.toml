[package]
name = "gtfs-pipeline"
version = "0.9.7"
edition = "2021"
license.workspace = true
description = "GTFS Schedule validation pipeline behind the GTFS Analyzer. Internal API, no stability guarantee."
repository = "https://github.com/ttezer/gtfs-analyzer"
keywords = ["gtfs", "transit", "validator", "parser"]
categories = ["parser-implementations"]

[dependencies]
gtfs-core = { version = "0.9.7", path = "../core" }
gtfs-rules = { version = "0.9.7", path = "../rules" }
gtfs-config = { version = "0.9.7", path = "../config" }
serde = { workspace = true }
serde_json = { workspace = true }
zip = { workspace = true }
chrono-tz = "0.10"
smol_str = "0.2"
url = "2"
rustc-hash = "2"
rayon = { version = "1", optional = true }
# Shewchuk adaptive-precision geometrik predikatlar (orient2d). BAĞIMLILIKSIZ ve no_std.
# Gerekçe: poligon self-intersection tespiti naif f64 ile KARARSIZ — 2026-08-06 ölçümünde
# aynı 21 poligon üzerinde epsilon/uygulama seçimi 5 ile 17 arasında sonuç verdi ve monoton
# bile değildi. Alternatifler: `geo` (çok daha büyük, WASM bellek tavanı riski) ya da elle
# adaptive precision (Shewchuk algoritmasını yeniden yazmak). En küçük yeterli araç bu.
robust = "1.2.0"

[features]
# Native'de VARSAYILAN AÇIK: VBB (5,7M stop_times) ölçümünde K6 4.889ms → 2.634ms (1,86×),
# toplam 13,07s → 11,07s; notice çıktısı bit-özdeş doğrulandı (baseline diff temiz).
# WASM bu varsayılanı ALMAZ (crates/wasm `default-features = false` ile bağlar): orada
# thread kurulumu ayrı (`threads` feature → wasm-bindgen-rayon) ve wasm32-threaded ölçümü
# K2'yi yavaşlatıp net kayıp veriyordu.
default = ["parallel"]

# K6 check'lerini iş-parçacıkları arası paralel çalıştırır (native: gerçek threadler).
# Çıktı seri ile BİREBİR (renumber + kanonik birleştirme). WASM'da ayrı thread kurulumu gerekir.
parallel = ["dep:rayon"]

# Public SDK WASM build'i için teşhis loglarını susturur. Validation davranışı
# değişmez; UI build'i bu feature'ı açmadığı için DevTools teşhisi korunur.
quiet = []

[target.'cfg(target_family = "wasm")'.dependencies]
web-sys = { version = "0.3", features = ["console"] }
