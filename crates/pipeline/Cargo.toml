[package]
name = "gtfs-pipeline"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
gtfs-core = { path = "../core" }
gtfs-rules = { path = "../rules" }
gtfs-config = { path = "../config" }
serde = { workspace = true }
serde_json = { workspace = true }
zip = { workspace = true }
chrono-tz = "0.10"
smol_str = "0.2"
url = "2"
rustc-hash = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["console"] }
