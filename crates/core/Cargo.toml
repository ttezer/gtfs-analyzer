[package]
name = "gtfs-core"
version.workspace = true
edition = "2021"
license.workspace = true
description = "Core types for the GTFS Analyzer validator. Internal API, no stability guarantee."
repository = "https://github.com/ttezer/gtfs-analyzer"
keywords = ["gtfs", "transit", "validator"]
categories = ["data-structures"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[features]
# Notice text translation (en/ja/fr) with the embedded dictionaries in locales/.
# CLI and the Python package enable it; the WASM build does not, so the web
# bundle does not carry ~500 KB of JSON.
i18n = []
