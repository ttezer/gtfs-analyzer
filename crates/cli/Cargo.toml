[package]
name = "gtfs-analyzer"
version = "0.10.0"
edition = "2021"
license.workspace = true
description = "Validate a GTFS Schedule feed from the command line: 600+ rules, notices with remediation, publication and quality scores, JSON or human-readable output."
repository = "https://github.com/ttezer/gtfs-analyzer"
keywords = ["gtfs", "transit", "validator", "cli", "opendata"]
categories = ["command-line-utilities", "parser-implementations"]
readme = "README.md"
build = "build.rs"

[[bin]]
name = "gtfs-analyzer"
path = "src/main.rs"

[dependencies]
gtfs-core = { version = "0.10.0", path = "../core" }
gtfs-pipeline = { version = "0.10.0", path = "../pipeline" }
gtfs-config = { version = "0.10.0", path = "../config" }
gtfs-rules = { version = "0.10.0", path = "../rules" }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }
chrono = "0.4"

[build-dependencies]
serde_json = { workspace = true }

[dev-dependencies]
zip = { workspace = true }
