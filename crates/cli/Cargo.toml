[package]
name = "gtfs-analyzer"
version.workspace = true
edition = "2021"
license.workspace = true
description = "Validate a GTFS Schedule feed from the command line: 600+ rules, notices with remediation, publication and quality scores, JSON or human-readable output."
repository = "https://github.com/ttezer/gtfs-analyzer"
keywords = ["gtfs", "transit", "validator", "cli", "opendata"]
categories = ["command-line-utilities", "parser-implementations"]
build = "build.rs"

[[bin]]
name = "gtfs-analyzer"
path = "src/main.rs"

[dependencies]
gtfs-core = { workspace = true, features = ["i18n"] }
gtfs-pipeline = { workspace = true }
gtfs-config = { workspace = true }
gtfs-rules = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }
chrono = "0.4"

[build-dependencies]
serde_json = { workspace = true }

[dev-dependencies]
zip = { workspace = true }
