[package]
name = "gtfs-analyzer"
version = "0.9.7"
edition = "2021"
license.workspace = true
description = "Validate a GTFS Schedule feed from the command line: 600+ rules, notices with remediation, publication and quality scores, JSON or human-readable output."
repository = "https://github.com/ttezer/gtfs-analyzer"
keywords = ["gtfs", "transit", "validator", "cli", "opendata"]
categories = ["command-line-utilities", "parser-implementations"]
readme = "README.md"

[[bin]]
name = "gtfs-analyzer"
path = "src/main.rs"

[dependencies]
gtfs-core = { path = "../core" }
gtfs-pipeline = { path = "../pipeline" }
gtfs-config = { path = "../config" }
gtfs-rules = { path = "../rules" }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }
chrono = "0.4"

[dev-dependencies]
zip = { workspace = true }
