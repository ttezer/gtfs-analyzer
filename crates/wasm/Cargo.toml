[package]
name = "gtfs-wasm"
version = "0.10.0"
edition = "2021"
license.workspace = true
# cdylib bir wasm hedefidir; npm paketi olarak dağıtılıyor, crates.io'ya değil.
publish = false
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gtfs-core = { path = "../core" }
# default-features = false: pipeline'ın native varsayılanı `parallel`'dir (rayon). WASM'da
# thread'ler ayrı kurulur — aşağıdaki `threads` feature'ı üzerinden. Varsayılan WASM yolu seri.
gtfs-pipeline = { path = "../pipeline", default-features = false }
gtfs-config = { path = "../config" }
wasm-bindgen = { workspace = true }
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
serde = { workspace = true }
serde_json = { workspace = true }
zip = { workspace = true }
wasm-bindgen-rayon = { version = "1.3", optional = true }

[build-dependencies]
serde_json = { workspace = true }

[features]
# Public `gtfs-sdk` build'i için UI/teşhis konsol çıktısını susturur.
quiet = ["gtfs-pipeline/quiet"]

# Public SDK notice metinlerini İngilizceye çevirir. UI bu feature'ı açmaz;
# kendi locale katmanı için pipeline'ın doğal metnini kullanmaya devam eder.
sdk-en = []

# Tarayıcıda gerçek iş-parçacıkları (SharedArrayBuffer + Web Workers). Yalnızca
# nightly + build-std + atomics ile derlenir; varsayılan (cargo test / seri wasm) KAPALI.
# K6 paralelliğini gtfs-pipeline/parallel üzerinden açar; init_thread_pool'u JS'e verir.
threads = ["dep:wasm-bindgen-rayon", "gtfs-pipeline/parallel"]

[package.metadata.wasm-pack.profile.release]
# --enable-threads: threaded build atomics/shared-memory içerir; wasm-opt bunu korumalı.
# Seri build'de zararsız no-op (atomik işlem yok).
wasm-opt = ["-O3", "--enable-bulk-memory", "--enable-threads"]
