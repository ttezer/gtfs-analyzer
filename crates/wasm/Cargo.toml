[package]
name = "gtfs-wasm"
version = "0.1.2"
edition = "2021"
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gtfs-core = { path = "../core" }
gtfs-pipeline = { path = "../pipeline" }
gtfs-config = { path = "../config" }
wasm-bindgen = { workspace = true }
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
serde = { workspace = true }
serde_json = { workspace = true }
zip = { workspace = true }
wasm-bindgen-rayon = { version = "1.3", optional = true }

[features]
# Tarayıcıda gerçek iş-parçacıkları (SharedArrayBuffer + Web Workers). Yalnızca
# nightly + build-std + atomics ile derlenir; varsayılan (cargo test / seri wasm) KAPALI.
# K6 paralelliğini gtfs-pipeline/parallel üzerinden açar; init_thread_pool'u JS'e verir.
threads = ["dep:wasm-bindgen-rayon", "gtfs-pipeline/parallel"]

[package.metadata.wasm-pack.profile.release]
# --enable-threads: threaded build atomics/shared-memory içerir; wasm-opt bunu korumalı.
# Seri build'de zararsız no-op (atomik işlem yok).
wasm-opt = ["-O3", "--enable-bulk-memory", "--enable-threads"]
