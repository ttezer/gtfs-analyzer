[workspace]
members = [
    "crates/core",
    "crates/rules",
    "crates/pipeline",
    "crates/config",
    "crates/cli",
    "crates/wasm",
    "crates/python",
]
resolver = "2"

[workspace.package]
# Motor sürümünün TEK kaynağı. Yedi crate `version.workspace = true` ile buradan okur;
# Python paketi (maturin) crates/python üzerinden aynı değeri alır. Bump için:
#   node scripts/bump-version.mjs X.Y.Z
# (kalan kopyaları — iç pinler, SDK ENGINE_VERSION, ui/package.json — o yazar,
# sdk/scripts/check-version.mjs hepsinin eşitliğini denetler).
version = "0.15.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate", "time"] }
wasm-bindgen = "0.2"
# crates.io'ya yayınlanan iç crate'ler: yayında path yerine bu sürüm kullanılır.
gtfs-core = { version = "0.15.0", path = "crates/core" }
gtfs-config = { version = "0.15.0", path = "crates/config" }
gtfs-rules = { version = "0.15.0", path = "crates/rules" }
gtfs-pipeline = { version = "0.15.0", path = "crates/pipeline" }

# NOT: Geçmişte lto kapatılmıştı (TriMet 6059→6085 regresyonunun lto FP-drift mi yoksa
# flat-layout bug'ı mı olduğu izole edilemediği için). flat-layout bug'ı sonradan düzeldi;
# lto bu gerçek feed üzerinde notice-histogram + skor kapısıyla yeniden doğrulandı → çıktı
# (per-rule sayılar, R1–R9, metrikler) lto=false ile BİREBİR aynı. wasm32 FP'si deterministik
# ve Rust FP reassociation yapmadığı için lto yalnızca kod üretimini hızlandırır, mantığı değil.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
