[workspace]
members = [
    "crates/core",
    "crates/rules",
    "crates/pipeline",
    "crates/config",
    "crates/wasm",
]
resolver = "2"

[workspace.package]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate", "time"] }
wasm-bindgen = "0.2"

# NOT: Geçmişte lto kapatılmıştı (TriMet 6059→6085 regresyonunun lto FP-drift mi yoksa
# flat-layout bug'ı mı olduğu izole edilemediği için). flat-layout bug'ı sonradan düzeldi;
# lto bu gerçek feed üzerinde notice-histogram + skor kapısıyla yeniden doğrulandı → çıktı
# (per-rule sayılar, R1–R9, metrikler) lto=false ile BİREBİR aynı. wasm32 FP'si deterministik
# ve Rust FP reassociation yapmadığı için lto yalnızca kod üretimini hızlandırır, mantığı değil.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
