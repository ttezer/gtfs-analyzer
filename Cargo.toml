[workspace]
members = [
    "crates/core",
    "crates/rules",
    "crates/pipeline",
    "crates/config",
    "crates/wasm",
]
resolver = "2"

[workspace.package]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate", "time"] }
wasm-bindgen = "0.2"
