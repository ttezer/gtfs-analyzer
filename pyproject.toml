[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "gtfs-analyzer"
version = "0.14.0"
description = "GTFS validation and quality analysis powered by the Rust GTFS Analyzer engine."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "GTFS Analyzer contributors" }]
keywords = ["gtfs", "transit", "validator", "public-transport", "data-quality"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/ttezer/gtfs-analyzer"
Repository = "https://github.com/ttezer/gtfs-analyzer"
Issues = "https://github.com/ttezer/gtfs-analyzer/issues"

[tool.maturin]
manifest-path = "crates/python/Cargo.toml"
module-name = "gtfs_analyzer.gtfs_analyzer"
python-source = "python"
