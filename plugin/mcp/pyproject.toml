[project]
name = "gtfs-validator-mcp"
version = "0.1.0"
description = "GTFS Validator MCP server powered by the native GTFS Analyzer CLI"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.20,<2",
  "httpx>=0.27,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]

[project.scripts]
gtfs-validator-mcp = "server:main"
