name: Rebuild Full Catalog Fix Cleanly

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  rebuild_test_commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Reset target files to main and reapply surgical patch
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- \
            crates/pipeline/src/k2/fare_attributes.rs \
            crates/pipeline/src/k4_cross_ref.rs \
            crates/pipeline/tests/emit_proof.rs \
            docs/rules/FAR/FAR_006.md \
            docs/rules/TRP/TRP_017.md
          python3 benchmark/rebuild_full_catalog_fix_clean.py
      - name: Run focused tests without repo-wide formatting
        run: |
          set -euo pipefail
          cargo test -p gtfs-pipeline --test emit_proof full_catalog_ -- --nocapture
          cargo test -p gtfs-pipeline --test emit_proof runtime_emit_proof -- --nocapture
      - name: Commit clean tested diff
        run: |
          set -euo pipefail
          git rm .github/workflows/rebuild-full-catalog-fix-clean.yml benchmark/rebuild_full_catalog_fix_clean.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/pipeline/src/k2/fare_attributes.rs crates/pipeline/src/k4_cross_ref.rs crates/pipeline/tests/emit_proof.rs docs/rules/FAR/FAR_006.md docs/rules/TRP/TRP_017.md
          git commit -m 'fix: rebuild full-catalog findings as surgical diff'
          git push origin HEAD:${GITHUB_HEAD_REF}
