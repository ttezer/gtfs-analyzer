name: Validator Shootout

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmark/validator-shootout/**'
      - '.github/workflows/benchmark-validator-shootout.yml'

permissions:
  contents: read

jobs:
  shootout:
    name: Analyzer vs TML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install TML validator SDK
        working-directory: benchmark/validator-shootout
        run: npm install --no-audit --no-fund

      - name: Inspect published TML module exports
        working-directory: benchmark/validator-shootout
        run: |
          node --input-type=module <<'NODE'
          const m = await import('@tmlmobilidade/gtfs-validator');
          console.log('TML module keys:', Object.keys(m));
          console.log('TML default type:', typeof m.default);
          if (m.default && typeof m.default === 'object') console.log('TML default keys:', Object.keys(m.default));
          NODE

      - name: Adapt discovery runner to actual TML export shape
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('benchmark/validator-shootout/run.mjs')
          s = p.read_text()
          old = "import { GTFSValidator, getValidatorInfo } from '@tmlmobilidade/gtfs-validator';"
          new = """const __tmlModule = await import('@tmlmobilidade/gtfs-validator');
          const __tmlRoot = (__tmlModule.default && typeof __tmlModule.default === 'object') ? __tmlModule.default : __tmlModule;
          const GTFSValidator = __tmlModule.GTFSValidator ?? __tmlRoot.GTFSValidator ?? (typeof __tmlModule.default === 'function' ? __tmlModule.default : null);
          const getValidatorInfo = __tmlModule.getValidatorInfo ?? __tmlRoot.getValidatorInfo ?? (async () => ({ moduleKeys: Object.keys(__tmlModule), defaultType: typeof __tmlModule.default, defaultKeys: (__tmlRoot && typeof __tmlRoot === 'object') ? Object.keys(__tmlRoot) : [] }));
          if (typeof GTFSValidator !== 'function') throw new Error(`Could not resolve GTFSValidator export; module keys=${Object.keys(__tmlModule)} defaultType=${typeof __tmlModule.default} defaultKeys=${(__tmlRoot && typeof __tmlRoot === 'object') ? Object.keys(__tmlRoot) : []}`);"""
          if old not in s:
              raise SystemExit('expected import line not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Build GTFS Analyzer CLI
        run: cargo build --release -p gtfs-cli

      - name: Generate controlled fixtures
        run: python3 benchmark/validator-shootout/generate_fixtures.py

      - name: Run shootout
        run: node benchmark/validator-shootout/run.mjs

      - name: Publish benchmark summary
        if: always()
        run: |
          if [ -f benchmark/validator-shootout/results/report.md ]; then
            cat benchmark/validator-shootout/results/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload raw benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validator-shootout-results
          path: benchmark/validator-shootout/results/
          if-no-files-found: warn
          retention-days: 7
