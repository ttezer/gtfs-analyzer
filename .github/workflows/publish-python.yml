name: Publish Python package

# Yayın YALNIZ bir sürüm tag'inden yapılır; böylece PyPI paketi CLI binary'leriyle aynı
# commit'ten çıkar. 0.14.0 `main`'den elle yayınlandı ve `v0.14.0` tag'inden 138 commit
# ileride kaldı — aynı sürüm numarası kanala göre farklı motor demekti.
#
# Normal yol: `release.yml` release'i yayına aldıktan sonra bu workflow'u tag ref'iyle
# tetikler. `release: published` tetikleyicisi burada İŞE YARAMAZ: release'i
# `release.yml` GITHUB_TOKEN ile yayınlar ve GITHUB_TOKEN olayları başka workflow
# başlatmaz (`workflow_dispatch` bu kuralın istisnasıdır).
# Elle yeniden deneme: Actions → "Use workflow from" menüsünde tag'i seç.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # `if:` ile job atlamak koşuyu YEŞİL bırakır ve hiçbir şey yayınlanmadığı fark edilmez.
  # Tag dışı ref'te bu job kırmızı yanar, diğerleri ona bağlı olduğu için hiç başlamaz.
  require-tag:
    name: Require release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ref bir sürüm tag'i mi
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "tag" ] || [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::PyPI yayını yalnız vX.Y.Z tag'inden yapılır (ref_type=$REF_TYPE ref=$REF_NAME)."
            exit 1
          fi
          echo "tag ok: $REF_NAME"

  build-sdist:
    name: Build source distribution
    needs: require-tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check release version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import sys

          expected = os.environ["RELEASE_VERSION"].removeprefix("v")
          pyproject = pathlib.Path("pyproject.toml").read_text()
          cargo = pathlib.Path("crates/python/Cargo.toml").read_text()
          py_version = re.search(r'^version = "([^"]+)"', pyproject, re.MULTILINE).group(1)
          cargo_version = re.search(r'^version = "([^"]+)"', cargo, re.MULTILINE).group(1)
          if py_version != expected or cargo_version != expected:
              print(f"release={expected} pyproject={py_version} cargo-python={cargo_version}")
              sys.exit(1)
          print(f"Python release version ok: {expected}")
          PY

      - name: Build sdist
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8 # v1
        with:
          command: sdist
          args: --out dist
          maturin-version: 1.15.0

      - name: Upload sdist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-sdist
          path: dist/*

  build-wheels:
    name: Build wheel (${{ matrix.os }})
    needs: require-tag
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build wheel
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8 # v1
        with:
          command: build
          args: --release --out dist --compatibility pypi
          maturin-version: 1.15.0

      - name: Upload wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-wheel-${{ matrix.os }}
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          pattern: python-*
          merge-multiple: true

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true
