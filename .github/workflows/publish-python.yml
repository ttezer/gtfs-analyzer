name: Publish Python package

# Publishing is allowed only from a release tag, so the PyPI package comes from the same
# commit as the CLI binaries. 0.14.0 was published manually from `main` and ended up 138
# commits ahead of the `v0.14.0` tag — the same version number then meant different engines
# depending on the distribution channel.
#
# Normal path: `release.yml` triggers this workflow with the tag ref after publishing the
# release. The `release: published` trigger does NOT work here: `release.yml` publishes the
# release with GITHUB_TOKEN, and events created by GITHUB_TOKEN do not start another workflow
# (`workflow_dispatch` is the exception).
# To retry manually, select the tag from Actions → "Use workflow from".
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Skipping the job with `if:` leaves the run GREEN and hides the fact that nothing was
  # published. On a non-tag ref this job fails, so the dependent jobs never start.
  require-tag:
    name: Require release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Is the ref a release tag?
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "tag" ] || [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::PyPI yayını yalnız vX.Y.Z tag'inden yapılır (ref_type=$REF_TYPE ref=$REF_NAME)."
            exit 1
          fi
          echo "tag ok: $REF_NAME"

  build-sdist:
    name: Build source distribution
    needs: require-tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check release version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import sys

          # The package version comes from [workspace.package] version in the root
          # Cargo.toml: crates/python inherits it, and pyproject.toml delegates the version
          # to maturin with `dynamic = ["version"]`. Defining either version independently
          # would break the single source of truth.
          expected = os.environ["RELEASE_VERSION"].removeprefix("v")
          root = pathlib.Path("Cargo.toml").read_text()
          crate = pathlib.Path("crates/python/Cargo.toml").read_text()
          pyproject = pathlib.Path("pyproject.toml").read_text()
          match = re.search(r'^\[workspace\.package\][^\[]*?^version\s*=\s*"([^"]+)"', root, re.MULTILINE | re.DOTALL)
          workspace_version = match.group(1) if match else None
          inherits = re.search(r'^version\.workspace\s*=\s*true\s*$', crate, re.MULTILINE) is not None
          dynamic = re.search(r'^dynamic\s*=\s*\[\s*"version"\s*\]', pyproject, re.MULTILINE) is not None
          if workspace_version != expected or not inherits or not dynamic:
              print(f"release={expected} workspace={workspace_version} "
                    f"crate_inherits={inherits} pyproject_dynamic={dynamic}")
              sys.exit(1)
          print(f"Python release version ok: {expected}")
          PY

      - name: Build sdist
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8 # v1
        with:
          command: sdist
          args: --out dist
          maturin-version: 1.15.0

      - name: Upload sdist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-sdist
          path: dist/*

  build-wheels:
    name: Build wheel (${{ matrix.os }})
    needs: require-tag
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build wheel
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8 # v1
        with:
          command: build
          args: --release --out dist --compatibility pypi
          maturin-version: 1.15.0

      - name: Upload wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-wheel-${{ matrix.os }}
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          pattern: python-*
          merge-multiple: true

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true
