name: Full MobilityDatabase GTFS Schedule Audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmark/audit_all/**'
      - '.github/workflows/benchmark-validator-audit-all-mdb.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validator-audit-all-mdb-${{ github.ref }}
  cancel-in-progress: true

env:
  MD_VERSION: '8.0.1'
  SHARD_COUNT: '640'

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      shards_a: ${{ steps.matrix.outputs.shards_a }}
      shards_b: ${{ steps.matrix.outputs.shards_b }}
      shards_c: ${{ steps.matrix.outputs.shards_c }}
      shards_d: ${{ steps.matrix.outputs.shards_d }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Syntax-check benchmark helpers
        run: python3 -m py_compile benchmark/audit_all/*.py
      - name: Select all testable GTFS Schedule feeds
        run: |
          set -euo pipefail
          mkdir -p benchmark/audit_all/run
          python3 benchmark/audit_all/select_corpus.py \
            --out benchmark/audit_all/run/manifest.json \
            --catalog-out benchmark/audit_all/run/feeds_v2.csv
      - name: Guard Schedule-only scope
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("benchmark/audit_all/run/manifest.json").read_text())
          feeds=m["feeds"]
          bad=[f for f in feeds if f.get("data_type")!="gtfs"]
          assert feeds, "empty GTFS Schedule corpus"
          assert not bad, f"non-Schedule feed leaked into corpus: {bad[:3]}"
          s=m["selection"]
          assert s["catalog_gtfs_schedule_rows"] >= s["selected_count"]
          print(json.dumps(s, indent=2))
          PY
      - name: Build shard matrices
        id: matrix
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          for name,start in (("shards_a",0),("shards_b",160),("shards_c",320),("shards_d",480)):
              print(f"{name}={json.dumps(list(range(start,start+160)),separators=(',',':'))}")
          PY
      - name: Upload corpus manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: audit-all-mdb-corpus
          path: |
            benchmark/audit_all/run/manifest.json
            benchmark/audit_all/run/feeds_v2.csv
          retention-days: 30

  build-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Build GTFS Analyzer release binary
        run: |
          cargo build --release -p gtfs-cli
          mkdir -p benchmark/audit_all/tools
          cp target/release/gtfs-analyzer benchmark/audit_all/tools/gtfs-analyzer
          chmod +x benchmark/audit_all/tools/gtfs-analyzer
          benchmark/audit_all/tools/gtfs-analyzer --version > benchmark/audit_all/tools/analyzer-version.txt 2>&1 || true
          git rev-parse HEAD > benchmark/audit_all/tools/analyzer-commit.txt
      - name: Download MobilityData v8.0.1 CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/MobilityData/gtfs-validator/releases/tags/v${MD_VERSION}"
          ASSET_URL="$(
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API" \
            | jq -r '.assets[] | select(.name | endswith("-cli.jar")) | .browser_download_url' \
            | head -n1
          )"
          test -n "$ASSET_URL" && test "$ASSET_URL" != "null"
          curl --retry 3 --retry-all-errors -fL "$ASSET_URL" -o benchmark/audit_all/tools/md-cli.jar
          printf 'MobilityData gtfs-validator v%s\n' "$MD_VERSION" > benchmark/audit_all/tools/md-version.txt
      - name: Cache ijson wheel
        run: |
          python3 -m pip download --only-binary=:all: ijson -d benchmark/audit_all/tools/
      - name: Record tool hashes
        run: |
          (cd benchmark/audit_all/tools && sha256sum * > SHA256SUMS.txt)
      - name: Upload tools
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: audit-all-mdb-tools
          path: benchmark/audit_all/tools/
          retention-days: 30

  audit_a:
    needs: [prepare, build-tools]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: ${{ fromJson(needs.prepare.outputs.shards_a) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download corpus
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: audit-all-mdb-corpus
          path: benchmark/audit_all/run
      - name: Download tools
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: audit-all-mdb-tools
          path: benchmark/audit_all/tools
      - name: Prepare local tools
        run: |
          chmod +x benchmark/audit_all/tools/gtfs-analyzer
          python3 -m pip install --no-index benchmark/audit_all/tools/ijson-*.whl
      - name: Audit shard ${{ matrix.shard }}
        run: |
          mkdir -p benchmark/audit_all/shards
          python3 benchmark/audit_all/run_shard.py \
            --manifest benchmark/audit_all/run/manifest.json \
            --shard "${{ matrix.shard }}" \
            --shards "$SHARD_COUNT" \
            --analyzer benchmark/audit_all/tools/gtfs-analyzer \
            --md-jar benchmark/audit_all/tools/md-cli.jar \
            --out "benchmark/audit_all/shards/shard-$(printf '%03d' '${{ matrix.shard }}').jsonl"
      - name: Upload shard checkpoint
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: audit-all-mdb-shard-${{ matrix.shard }}
          path: benchmark/audit_all/shards/
          retention-days: 30

  audit_b:
    needs: [prepare, build-tools]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: ${{ fromJson(needs.prepare.outputs.shards_b) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download corpus
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: audit-all-mdb-corpus
          path: benchmark/audit_all/run
      - name: Download tools
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: audit-all-mdb-tools
          path: benchmark/audit_all/tools
      - name: Prepare local tools
        run: |
          chmod +x benchmark/audit_all/tools/gtfs-analyzer
          python3 -m pip install --no-index benchmark/audit_all/tools/ijson-*.whl
      - name: Audit shard ${{ matrix.shard }}
        run: |
          mkdir -p benchmark/audit_all/shards
          python3 benchmark/audit_all/run_shard.py \
            --manifest benchmark/audit_all/run/manifest.json \
            --shard "${{ matrix.shard }}" \
            --shards "$SHARD_COUNT" \
            --analyzer benchmark/audit_all/tools/gtfs-analyzer \
            --md-jar benchmark/audit_all/tools/md-cli.jar \
            --out "benchmark/audit_all/shards/shard-$(printf '%03d' '${{ matrix.shard }}').jsonl"
      - name: Upload shard checkpoint
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: audit-all-mdb-shard-${{ matrix.shard }}
          path: benchmark/audit_all/shards/
          retention-days: 30

  audit_c:
    needs: [prepare, build-tools]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: ${{ fromJson(needs.prepare.outputs.shards_c) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download corpus
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: audit-all-mdb-corpus
          path: benchmark/audit_all/run
      - name: Download tools
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: audit-all-mdb-tools
          path: benchmark/audit_all/tools
      - name: Prepare local tools
        run: |
          chmod +x benchmark/audit_all/tools/gtfs-analyzer
          python3 -m pip install --no-index benchmark/audit_all/tools/ijson-*.whl
      - name: Audit shard ${{ matrix.shard }}
        run: |
          mkdir -p benchmark/audit_all/shards
          python3 benchmark/audit_all/run_shard.py \
            --manifest benchmark/audit_all/run/manifest.json \
            --shard "${{ matrix.shard }}" \
            --shards "$SHARD_COUNT" \
            --analyzer benchmark/audit_all/tools/gtfs-analyzer \
            --md-jar benchmark/audit_all/tools/md-cli.jar \
            --out "benchmark/audit_all/shards/shard-$(printf '%03d' '${{ matrix.shard }}').jsonl"
      - name: Upload shard checkpoint
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: audit-all-mdb-shard-${{ matrix.shard }}
          path: benchmark/audit_all/shards/
          retention-days: 30

  audit_d:
    needs: [prepare, build-tools]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: ${{ fromJson(needs.prepare.outputs.shards_d) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download corpus
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: audit-all-mdb-corpus
          path: benchmark/audit_all/run
      - name: Download tools
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: audit-all-mdb-tools
          path: benchmark/audit_all/tools
      - name: Prepare local tools
        run: |
          chmod +x benchmark/audit_all/tools/gtfs-analyzer
          python3 -m pip install --no-index benchmark/audit_all/tools/ijson-*.whl
      - name: Audit shard ${{ matrix.shard }}
        run: |
          mkdir -p benchmark/audit_all/shards
          python3 benchmark/audit_all/run_shard.py \
            --manifest benchmark/audit_all/run/manifest.json \
            --shard "${{ matrix.shard }}" \
            --shards "$SHARD_COUNT" \
            --analyzer benchmark/audit_all/tools/gtfs-analyzer \
            --md-jar benchmark/audit_all/tools/md-cli.jar \
            --out "benchmark/audit_all/shards/shard-$(printf '%03d' '${{ matrix.shard }}').jsonl"
      - name: Upload shard checkpoint
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: audit-all-mdb-shard-${{ matrix.shard }}
          path: benchmark/audit_all/shards/
          retention-days: 30

  aggregate:
    needs: [prepare, build-tools, audit_a, audit_b, audit_c, audit_d]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download corpus
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: audit-all-mdb-corpus
          path: benchmark/audit_all/run
      - name: Download all available shard checkpoints
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: audit-all-mdb-shard-*
          path: benchmark/audit_all/all-shards
          merge-multiple: true
      - name: Aggregate full-catalog results
        run: |
          mkdir -p benchmark/audit_all/final
          python3 benchmark/audit_all/aggregate.py \
            --results-dir benchmark/audit_all/all-shards \
            --map-file spec-audit/md_parity_audit.py \
            --manifest benchmark/audit_all/run/manifest.json \
            --out-dir benchmark/audit_all/final
          cp benchmark/audit_all/run/manifest.json benchmark/audit_all/final/corpus-manifest.json
          sed -i 's/1000-feed GTFS Analyzer vs MobilityData audit/Full MobilityDatabase GTFS Schedule — GTFS Analyzer vs MobilityData audit/' benchmark/audit_all/final/AUDIT_SUMMARY.md
      - name: Record corpus completeness
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("benchmark/audit_all")
          manifest=json.loads((root/"run/manifest.json").read_text())
          summary=json.loads((root/"final/summary.json").read_text())
          expected=int(manifest["selection"]["selected_count"])
          attempted=int(summary["attempted"])
          excluded=int(manifest["selection"].get("excluded_schedule_count",0))
          result={
            "catalog_gtfs_schedule_rows": manifest["selection"]["catalog_gtfs_schedule_rows"],
            "testable_schedule_rows": expected,
            "catalog_schedule_rows_without_public_latest": excluded,
            "attempted": attempted,
            "complete": attempted == expected,
            "missing_attempts": expected-attempted,
          }
          (root/"final/completeness.json").write_text(json.dumps(result,indent=2)+"\n")
          print(json.dumps(result,indent=2))
          PY
      - name: Extract pinned raw evidence
        run: |
          python3 benchmark/audit_all/extract_evidence.py \
            --reps benchmark/audit_all/final/triage-representatives.json \
            --all-results benchmark/audit_all/final/all-results.json.gz \
            --max 100 \
            --out benchmark/audit_all/final/raw-evidence.json
      - name: Bundle final audit
        if: always()
        run: |
          tar -C benchmark/audit_all/final -czf benchmark/audit_all/validator-audit-all-mdb-results.tar.gz .
          sha256sum benchmark/audit_all/validator-audit-all-mdb-results.tar.gz > benchmark/audit_all/validator-audit-all-mdb-results.tar.gz.sha256
      - name: Upload final audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: validator-audit-all-mdb-final
          path: |
            benchmark/audit_all/final/
            benchmark/audit_all/validator-audit-all-mdb-results.tar.gz
            benchmark/audit_all/validator-audit-all-mdb-results.tar.gz.sha256
          retention-days: 30
      - name: Enforce complete testable corpus
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("benchmark/audit_all/final/completeness.json")
          if not p.exists():
              raise SystemExit("completeness.json missing")
          c=json.loads(p.read_text())
          if not c["complete"]:
              raise SystemExit(f"full corpus incomplete: {c['missing_attempts']} testable Schedule feeds have no result row")
          PY
