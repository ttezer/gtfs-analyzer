name: Publish Kotlin package

# Publishing happens ONLY from a release tag, so the Maven Central jar ships
# from the same commit as the CLI binaries and the other SDKs (see
# publish-python.yml for the rationale — the Kotlin pipeline mirrors it).
#
# Normal path: `release.yml` publishes the GitHub release, then someone
# triggers this workflow manually against the release tag. A `release:
# published` trigger would NOT work here: `release.yml` publishes the
# release using GITHUB_TOKEN, and GITHUB_TOKEN-authored events don't start
# other workflows (`workflow_dispatch` is the documented exception to that
# rule).
# Manual retry: Actions -> "Use workflow from" -> pick the tag.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Skipping a job with `if:` leaves the run green and a missed publish goes
  # unnoticed. Failing this job red on a non-tag ref means everything that
  # depends on it never starts.
  require-tag:
    name: Require release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check ref is a release tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "tag" ] || [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Maven Central publish only runs from a vX.Y.Z tag (ref_type=$REF_TYPE ref=$REF_NAME)."
            exit 1
          fi
          echo "tag ok: $REF_NAME"

  build-natives:
    name: Build native library (${{ matrix.tag }})
    needs: require-tag
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tag: linux-x86_64
          - os: ubuntu-24.04-arm
            tag: linux-aarch64
          - os: macos-latest
            tag: darwin-aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Build native library
        run: cargo build --release -p gtfs-analyzer-jvm

      - name: Determine native library extension
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            echo "LIB_EXT=dylib" >> "$GITHUB_ENV"
          else
            echo "LIB_EXT=so" >> "$GITHUB_ENV"
          fi

      - name: Upload native library artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-${{ matrix.tag }}
          path: target/release/libgtfs_jvm.${{ env.LIB_EXT }}

  publish:
    name: Publish to Maven Central
    needs: [require-tag, build-natives]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Check release version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import sys

          # Kotlin package version comes from the root Cargo.toml
          # [workspace.package] version, the same way kotlin/build.gradle.kts
          # derives `project.version`. If the tag and the workspace version
          # ever disagree, the jar and the engine it wraps have drifted.
          expected = os.environ["RELEASE_VERSION"].removeprefix("v")
          root = pathlib.Path("Cargo.toml").read_text()
          match = re.search(r'^\[workspace\.package\][^\[]*?^version\s*=\s*"([^"]+)"', root, re.MULTILINE | re.DOTALL)
          workspace_version = match.group(1) if match else None
          if workspace_version != expected:
              print(f"release={expected} workspace={workspace_version}")
              sys.exit(1)
          print(f"Kotlin release version ok: {expected}")
          PY

      - name: Download native library (linux-x86_64)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: native-linux-x86_64
          path: artifacts/linux-x86_64

      - name: Download native library (linux-aarch64)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: native-linux-aarch64
          path: artifacts/linux-aarch64

      - name: Download native library (darwin-aarch64)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: native-darwin-aarch64
          path: artifacts/darwin-aarch64

      - name: Copy native libraries into Gradle resources
        working-directory: kotlin
        # -PskipNativeBuild=true: without it, the later `./gradlew publish` would pull in
        # processResources -> buildNativeForCurrentPlatform and rerun `cargo build --release`
        # for this runner's own platform (linux-x86_64, since this job runs on ubuntu-latest),
        # overwriting the linux-x86_64 artifact copied in here by the matrix job and risking a
        # timeout from a full LTO rebuild. See build.gradle.kts for the full explanation.
        run: |
          ./gradlew copyNativeLib -PnativeLibFile=../artifacts/linux-x86_64/libgtfs_jvm.so -PplatformTag=linux-x86_64 -PskipNativeBuild=true
          ./gradlew copyNativeLib -PnativeLibFile=../artifacts/linux-aarch64/libgtfs_jvm.so -PplatformTag=linux-aarch64 -PskipNativeBuild=true
          ./gradlew copyNativeLib -PnativeLibFile=../artifacts/darwin-aarch64/libgtfs_jvm.dylib -PplatformTag=darwin-aarch64 -PskipNativeBuild=true

      - name: Publish to Maven Central
        working-directory: kotlin
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSPHRASE }}
        run: ./gradlew publish -PskipNativeBuild=true
