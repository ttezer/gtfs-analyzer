name: Release

# Sürüm tag'i push edildiğinde CLI binary'lerini derleyip GitHub Release'e yükler.
# Amaç: entegre eden projelerin Rust toolchain kurmadan gtfs-analyzer'ı çalıştırabilmesi.
#
# Akış: önce TASLAK release açılır → matris her platformun asset'ini oraya yükler →
# hepsi başarılıysa taslak yayına alınır. Böylece bir platform derlenemezse yarım
# bir release yayınlanmaz.
#
# Web arayüzü bu workflow'dan etkilenmez; onu ci.yml'deki deploy job'ı yayınlar.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  create-release:
    name: Taslak Release aç
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Taslak release oluştur
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid release tag: $RELEASE_TAG"
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --draft \
            --title "$RELEASE_TAG" \
            --generate-notes

  build:
    name: ${{ matrix.asset }}
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: gtfs-analyzer-x86_64-linux.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: gtfs-analyzer-aarch64-macos.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: gtfs-analyzer-x86_64-windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Rust toolchain kur
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-release-${{ matrix.target }}-

      # Release profili lto="fat" + codegen-units=1 kullanır (Cargo.toml).
      - name: CLI derle
        run: cargo build --release -p gtfs-analyzer --target ${{ matrix.target }}

      # Yüklenen binary'nin gerçekten çalıştığını ve sürümünün tag ile eşleştiğini
      # doğrula — yanlış sürüm yayınlamak sessiz ve pahalı bir hatadır.
      - name: Binary'yi doğrula ve arşivi hazırla
        shell: bash
        run: |
          NAME=gtfs-analyzer
          if [ "${{ runner.os }}" = "Windows" ]; then NAME=gtfs-analyzer.exe; fi
          BIN="target/${{ matrix.target }}/release/$NAME"

          # Duman testi: binary çalışıyor mu, kural kaydı okunabiliyor mu.
          "$BIN" --version --verbose
          "$BIN" rules --class spec --severity critical | tail -1

          # Tag ile Cargo.toml sürümü ayrışmışsa yanlış sürüm yayınlamaktansa kır.
          EXPECTED="${GITHUB_REF_NAME#v}"
          ACTUAL="$("$BIN" --version | awk '{print $2}')"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "sürüm uyuşmuyor: tag=$EXPECTED binary=$ACTUAL (crates/cli/Cargo.toml güncellendi mi?)"
            exit 1
          fi

          mkdir stage
          cp "$BIN" LICENSE README*.md stage/

      - name: Arşivle (tar.gz)
        if: runner.os != 'Windows'
        run: tar -czf "${{ matrix.asset }}" -C stage .

      - name: Arşivle (zip)
        if: runner.os == 'Windows'
        shell: bash
        run: (cd stage && 7z a "../${{ matrix.asset }}" .)

      - name: Taslak release'e yükle
        # Bu adım Windows runner'da da koşuyor ve `shell` belirtilmezse pwsh
        # kullanılır; orada `$RELEASE_TAG` tanımsız bir PowerShell değişkenidir,
        # boş string olarak geçer ve `gh` "release not found" der.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "$RELEASE_TAG" "${{ matrix.asset }}" --clobber

  publish:
    name: Release'i yayına al
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Taslağı yayınla
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false
