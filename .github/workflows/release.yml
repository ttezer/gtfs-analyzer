name: Release

# Builds the CLI binaries and uploads them to a GitHub Release when a release tag is pushed.
# This lets integrating projects run gtfs-analyzer without installing the Rust toolchain.
#
# Flow: create a DRAFT release first → the matrix uploads each platform's asset there →
# publish the draft only if everything succeeds. This prevents a partial release when one
# platform fails to build.
#
# The web UI is not affected by this workflow; the deploy job in ci.yml publishes it.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  create-release:
    name: Taslak Release aç
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid release tag: $RELEASE_TAG"
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --draft \
            --title "$RELEASE_TAG" \
            --generate-notes

  build:
    name: ${{ matrix.asset }}
    needs: create-release
    # Build code (build.rs, dependencies, smoke test) runs here, so this job gets NO
    # write access to the repository or the release: it only hands the archive to the
    # `publish` job as a workflow artifact.
    permissions:
      contents: read
      # Build provenance: lets users verify an asset was built here
      # (`gh attestation verify <asset> --repo ttezer/gtfs-analyzer`).
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: gtfs-analyzer-x86_64-linux.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: gtfs-analyzer-aarch64-macos.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: gtfs-analyzer-x86_64-windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-release-${{ matrix.target }}-

      # The release profile uses lto="fat" + codegen-units=1 (Cargo.toml).
      - name: Build CLI
        run: cargo build --release -p gtfs-analyzer --target ${{ matrix.target }}

      # Verify that the uploaded binary actually runs and that its version matches the tag;
      # publishing the wrong version is a silent and costly mistake.
      - name: Verify binary and prepare archive
        shell: bash
        run: |
          NAME=gtfs-analyzer
          if [ "${{ runner.os }}" = "Windows" ]; then NAME=gtfs-analyzer.exe; fi
          BIN="target/${{ matrix.target }}/release/$NAME"

          # Smoke test: does the binary run, and can it read the rule registry?
          "$BIN" --version --verbose
          "$BIN" rules --class spec --severity critical | tail -1

          # Fail rather than publish the wrong version if the tag and Cargo.toml diverge.
          EXPECTED="${GITHUB_REF_NAME#v}"
          ACTUAL="$("$BIN" --version | awk '{print $2}')"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "sürüm uyuşmuyor: tag=$EXPECTED binary=$ACTUAL (crates/cli/Cargo.toml güncellendi mi?)"
            exit 1
          fi

          mkdir stage
          cp "$BIN" LICENSE README*.md stage/

      - name: Archive (tar.gz)
        if: runner.os != 'Windows'
        run: tar -czf "${{ matrix.asset }}" -C stage .

      - name: Archive (zip)
        if: runner.os == 'Windows'
        shell: bash
        run: (cd stage && 7z a "../${{ matrix.asset }}" .)

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ matrix.asset }}

      - name: Hand the archive to the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Release'i yayına al
    needs: build
    runs-on: ubuntu-latest
    # The only job that writes release assets. It runs no build code: it downloads the
    # three archives built above and uploads them.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download built archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          assets=(dist/*.tar.gz dist/*.zip)
          if [ "${#assets[@]}" -ne 3 ]; then
            echo "expected 3 release archives, found ${#assets[@]}: ${assets[*]}"
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber

      - name: Publish draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false

  # Trigger `publish-python.yml` here so the PyPI package comes from the same tag.
  # The `release: published` event cannot be used: GITHUB_TOKEN publishes the release above,
  # and events created by GITHUB_TOKEN do not start another workflow; `workflow_dispatch` is
  # the exception. The PyPI trusted publisher is attached to `publish-python.yml`, so
  # publishing remains there.
  trigger-pypi:
    name: PyPI yayınını tetikle
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger publish-python.yml with the tag ref
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh workflow run publish-python.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG"
