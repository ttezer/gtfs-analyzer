name: Large-feed benchmark vs MobilityData builds

# Manual only. Compares GTFS Analyzer with several MobilityData validator builds
# (a release tag or any commit SHA) on a few large feeds, one runner per
# feed x build pair. Memory for MobilityData is the smallest -Xmx that still
# completes; see benchmark/md_large/run_pair.py.
on:
  workflow_dispatch:
    inputs:
      feeds:
        description: Comma-separated feed ids (MobilityDatabase ids, or nv_free)
        required: false
        default: mdb-2014,nv_free
      md_builds:
        description: Comma-separated label=ref pairs; a ref starting with v is a release tag, anything else a commit SHA built from source
        required: false
        default: v8.0.1=v8.0.1,master=7e7b7e605c873357855d16a7b5efef57b6953494,pr2235=4aeef9a013d1ad9f0e5a151aa3fbcc85a4b0dfba,pr2235-base=b8e8d6962d1de7638a0d0d1a02fbde60c943baf4
      search_heaps:
        description: MobilityData heaps (GB) tried below the 12 GB comparison run, in order
        required: false
        default: 10,8,6,4
      today:
        description: Validation date (YYYYMMDD) passed to both validators
        required: false
        default: '20261030'
      run_timeout:
        description: Per-run timeout in seconds
        required: false
        default: '3600'

permissions:
  contents: read

concurrency:
  group: benchmark-md-large-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      builds: ${{ steps.m.outputs.builds }}
      pairs: ${{ steps.m.outputs.pairs }}
    steps:
      - id: m
        env:
          FEEDS: ${{ inputs.feeds }}
          MD_BUILDS: ${{ inputs.md_builds }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          feeds = [f.strip() for f in os.environ["FEEDS"].split(",") if f.strip()]
          builds = []
          for item in os.environ["MD_BUILDS"].split(","):
              label, _, ref = item.strip().partition("=")
              assert re.fullmatch(r"[A-Za-z0-9._-]+", label), label
              assert re.fullmatch(r"v\d+\.\d+\.\d+|[0-9a-f]{40}", ref), ref
              builds.append({"label": label, "ref": ref})
          for f in feeds:
              assert re.fullmatch(r"[A-Za-z0-9_-]+", f), f
          pairs = [{"feed": f, **b} for f in feeds for b in builds]
          print("builds=" + json.dumps(builds, separators=(",", ":")))
          print("pairs=" + json.dumps(pairs, separators=(",", ":")))
          PY

  build-analyzer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Build GTFS Analyzer release binary
        run: |
          cargo build --release -p gtfs-analyzer
          mkdir -p tools
          cp target/release/gtfs-analyzer tools/
          git rev-parse HEAD > tools/analyzer-commit.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: md-large-analyzer
          path: tools/
          retention-days: 14

  build-md:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJson(needs.prepare.outputs.builds) }}
    steps:
      - name: Download release jar
        if: startsWith(matrix.build.ref, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ matrix.build.ref }}
        run: |
          mkdir -p jar
          gh release download "$REF" -R MobilityData/gtfs-validator -p '*-cli.jar' -D jar
          mv jar/*-cli.jar jar/md-cli.jar
      - name: Check out MobilityData source
        if: ${{ !startsWith(matrix.build.ref, 'v') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: MobilityData/gtfs-validator
          ref: ${{ matrix.build.ref }}
          fetch-depth: 0
          path: md-src
      - name: Java 17 (MobilityData build)
        if: ${{ !startsWith(matrix.build.ref, 'v') }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build MobilityData CLI jar
        if: ${{ !startsWith(matrix.build.ref, 'v') }}
        run: |
          (cd md-src && ./gradlew --no-daemon shadowJar)
          mkdir -p jar
          cp md-src/cli/build/libs/gtfs-validator-*-cli.jar jar/md-cli.jar
      - name: Record build
        env:
          REF: ${{ matrix.build.ref }}
        run: |
          printf '%s\n' "$REF" > jar/md-ref.txt
          sha256sum jar/md-cli.jar >> jar/md-ref.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: md-large-jar-${{ matrix.build.label }}
          path: jar/
          retention-days: 14

  run:
    needs: [prepare, build-analyzer, build-md]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        pair: ${{ fromJson(needs.prepare.outputs.pairs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Java 21 (run)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: md-large-analyzer
          path: tools
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: md-large-jar-${{ matrix.pair.label }}
          path: jar
      - name: Run pair
        env:
          FEED: ${{ matrix.pair.feed }}
          LABEL: ${{ matrix.pair.label }}
          TODAY: ${{ inputs.today }}
          HEAPS: ${{ inputs.search_heaps }}
          RUN_TIMEOUT: ${{ inputs.run_timeout }}
        run: |
          chmod +x tools/gtfs-analyzer
          python3 benchmark/md_large/run_pair.py \
            --feed "$FEED" --md-label "$LABEL" --md-jar jar/md-cli.jar \
            --analyzer tools/gtfs-analyzer --today "$TODAY" \
            --search-heaps "$HEAPS" --timeout "$RUN_TIMEOUT" \
            --out "records/$FEED-$LABEL.json"
          cat jar/md-ref.txt
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: md-large-record-${{ matrix.pair.feed }}-${{ matrix.pair.label }}
          path: records/
          if-no-files-found: warn
          retention-days: 30

  summarize:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: md-large-record-*
          path: records
      - name: Summarize
        run: |
          python3 benchmark/md_large/summarize.py records all-records.json summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: md-large-summary
          path: |
            all-records.json
            summary.md
          retention-days: 30
