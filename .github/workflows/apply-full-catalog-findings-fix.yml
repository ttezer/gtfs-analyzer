name: Apply Full Catalog Findings Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch_test_commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply patch
        run: python3 benchmark/apply_full_catalog_fixes.py
      - name: Test patch
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test -p gtfs-pipeline --test emit_proof full_catalog_ -- --nocapture
          cargo test -p gtfs-pipeline --test emit_proof runtime_emit_proof -- --nocapture
      - name: Commit tested patch
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-full-catalog-findings-fix.yml benchmark/apply_full_catalog_fixes.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/pipeline/src/k2/fare_attributes.rs crates/pipeline/src/k4_cross_ref.rs crates/pipeline/tests/emit_proof.rs docs/rules/FAR/FAR_006.md docs/rules/TRP/TRP_017.md
          git commit -m 'fix: remove two full-catalog false positives'
          git push origin HEAD:${GITHUB_HEAD_REF}
