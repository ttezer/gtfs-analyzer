name: Deploy

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # --- Kaynaktan build: committed ui/dist yerine taze derlenen artefakt deploy edilir.
      #     Böylece HEAD Rust/registry değişikliği wasm rebuild almamış olsa bile canlı site
      #     daima HEAD kaynağından üretilmiş wasm'ı çalıştırır (drift imkânsız).
      - name: Rust toolchain + wasm32 target kur
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-deploy-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-deploy-wasm-

      - name: wasm-pack kur
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: npm bağımlılıkları yükle
        working-directory: ui
        run: npm ci

      - name: WASM derle (seri — ui/pkg/)
        working-directory: ui
        run: npm run wasm

      - name: Nightly toolchain (threaded WASM / build-std için)
        run: |
          rustup toolchain install nightly --component rust-src --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain nightly

      - name: Threaded WASM derle (ui/pkg-threads/)
        working-directory: ui
        run: npm run wasm:threads

      - name: UI derle (taze ui/dist)
        working-directory: ui
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui/dist

      - id: deploy
        uses: actions/deploy-pages@v4
