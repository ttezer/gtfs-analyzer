name: Single-feed memory diagnostic

# Runs GTFS Analyzer and the MobilityData validator on ONE feed, each in its own step and
# under a memory cap, so a feed that is too big for the runner kills only that tool instead
# of the whole runner (exit 143, no logs, as mdb-2014 did in corpus runs 40399346692 and
# 44532875193). The log shows each tool's peak RSS, its exit code and a memory trace.
on:
  workflow_dispatch:
    inputs:
      feed_id:
        description: MobilityDatabase feed id, e.g. mdb-2014
        required: true
        default: mdb-2014
      memory_max:
        description: Memory cap per tool (systemd MemoryMax), e.g. 13G
        required: false
        default: 13G
      rayon_threads:
        description: RAYON_NUM_THREADS for the analyzer (empty = all cores; 1 = K6 steps one at a time)
        required: false
        default: ''
      run_md:
        description: Also run the MobilityData validator
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  MD_VERSION: '8.0.1'
  # Same pin as the full audit; the job refuses any other JAR.
  MD_CLI_SHA256: '19293ddd9b6f954f216d4f12054bd8a3232921751c4484339e339764a91000e2'
  MD_DATE: '2026-08-20'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Java 21
        if: inputs.run_md
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Build GTFS Analyzer release binary
        # alloc-stats: live/peak heap per stage in the GTFS_CLI_TIMING [mem] lines.
        run: cargo build --release -p gtfs-analyzer --features alloc-stats
      - name: Download MobilityData v8.0.1 CLI
        if: inputs.run_md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/MobilityData/gtfs-validator/releases/tags/v${MD_VERSION}"
          ASSET_URL="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "$API" \
            | jq -r '.assets[] | select(.name | endswith("-cli.jar")) | .browser_download_url' | head -n1)"
          test -n "$ASSET_URL" && test "$ASSET_URL" != "null"
          curl --retry 3 --retry-all-errors -fL "$ASSET_URL" -o md-cli.jar
          echo "${MD_CLI_SHA256}  md-cli.jar" | sha256sum -c -
      - name: Download feed
        env:
          FEED_ID: ${{ inputs.feed_id }}
        run: |
          set -euo pipefail
          case "$FEED_ID" in *[!A-Za-z0-9._-]*|'') echo "invalid feed id"; exit 1;; esac
          curl --retry 3 --retry-all-errors -fL "https://files.mobilitydatabase.org/${FEED_ID}/latest.zip" -o feed.zip
          ls -l feed.zip
          sha256sum feed.zip
          python3 -c "import zipfile; print('extracted bytes', sum(i.file_size for i in zipfile.ZipFile('feed.zip').infolist()))"
      - name: Runner memory
        run: |
          free -m
          nproc
      - name: GTFS Analyzer (capped)
        continue-on-error: true
        env:
          MEM_MAX: ${{ inputs.memory_max }}
          THREADS: ${{ inputs.rayon_threads }}
        run: |
          ( while true; do echo "[trace $(date +%T)] $(free -m | awk 'NR==2{print "used="$3"MB avail="$7"MB"}') $(ps -o rss=,comm= -C gtfs-analyzer | awk '{printf "%s=%dMB ", $2, $1/1024}')"; sleep 10; done ) &
          TRACE=$!
          set +e
          sudo systemd-run --scope --quiet -p MemoryMax="$MEM_MAX" -p MemorySwapMax=0 \
            --uid="$(id -u)" --gid="$(id -g)" -- \
            env GTFS_CLI_TIMING=1 GTFS_MEM_STEPS=1 ${THREADS:+RAYON_NUM_THREADS=$THREADS} /usr/bin/time -v -o analyzer-time.txt target/release/gtfs-analyzer validate feed.zip --json -o analyzer.json \
            2> analyzer-stderr.txt
          code=$?
          kill $TRACE
          echo "analyzer exit code: $code"
          grep -E "Maximum resident set size|Elapsed \(wall clock\)" analyzer-time.txt || true
          ls -l analyzer.json || true
          echo "--- stage memory ---"
          grep -E "^\[mem\] (after |K2 after|K2 st stream-end|K1-K6 notices|stop_times index live)" analyzer-stderr.txt | sed -E 's/, heap peak=.*//' | cut -c1-200 || true
          echo "--- last lines ---"
          tail -5 analyzer-stderr.txt | cut -c1-220
          exit $code
      - name: MobilityData validator (capped)
        if: inputs.run_md
        continue-on-error: true
        env:
          MEM_MAX: ${{ inputs.memory_max }}
        run: |
          ( while true; do echo "[trace $(date +%T)] $(free -m | awk 'NR==2{print "used="$3"MB avail="$7"MB"}') $(ps -o rss=,comm= -C java | awk '{printf "%s=%dMB ", $2, $1/1024}')"; sleep 10; done ) &
          TRACE=$!
          set +e
          sudo systemd-run --scope --quiet -p MemoryMax="$MEM_MAX" -p MemorySwapMax=0 \
            --uid="$(id -u)" --gid="$(id -g)" -- \
            /usr/bin/time -v java -Xmx12g -jar md-cli.jar -i feed.zip -o md -d "$MD_DATE" \
            > md-stdout.txt 2> md-time.txt
          code=$?
          kill $TRACE
          echo "MobilityData exit code: $code"
          grep -E "Maximum resident set size|Elapsed \(wall clock\)" md-time.txt || true
          grep -iE "OutOfMemoryError|Java heap space" md-time.txt md-stdout.txt | head -5 || true
          exit $code
