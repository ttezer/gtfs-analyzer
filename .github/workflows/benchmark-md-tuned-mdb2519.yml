name: MobilityData tuned mdb-2519

on:
  pull_request:
    branches: [agent/validator-shootout-100]
    paths:
      - '.github/workflows/benchmark-md-tuned-mdb2519.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  md-tuned:
    name: MobilityData v8.0.1 mdb-2519 -Xmx12g
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FEED_URL: 'https://files.mobilitydatabase.org/mdb-2519/mdb-2519-202608050156/mdb-2519-202608050156.zip'
      MD_VERSION: '8.0.1'

    steps:
      - uses: actions/checkout@v7

      - name: Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Record runner environment
        run: |
          mkdir -p benchmark/md-tuned-mdb2519/results
          { uname -a; lscpu; free -h; df -h; } > benchmark/md-tuned-mdb2519/results/runner-environment.txt

      - name: Download MobilityData CLI
        run: |
          set -euo pipefail
          mkdir -p benchmark/md-tuned-mdb2519/results
          API="https://api.github.com/repos/MobilityData/gtfs-validator/releases/tags/v${MD_VERSION}"
          ASSET_URL="$(curl -fsSL "$API" | jq -r '.assets[] | select(.name | endswith("-cli.jar")) | .browser_download_url' | head -n1)"
          curl --retry 3 --retry-all-errors -fL "$ASSET_URL" -o benchmark/md-tuned-mdb2519/mobilitydata-cli.jar
          sha256sum benchmark/md-tuned-mdb2519/mobilitydata-cli.jar > benchmark/md-tuned-mdb2519/results/mobilitydata-cli.sha256

      - name: Download exact mdb-2519 snapshot
        run: |
          set -euo pipefail
          mkdir -p benchmark/md-tuned-mdb2519/results/mdb-2519
          curl --retry 4 --retry-all-errors -fL "$FEED_URL" -o benchmark/md-tuned-mdb2519/mdb-2519.zip
          sha256sum benchmark/md-tuned-mdb2519/mdb-2519.zip | tee benchmark/md-tuned-mdb2519/results/mdb-2519/feed.sha256
          stat -c '%s' benchmark/md-tuned-mdb2519/mdb-2519.zip | tee benchmark/md-tuned-mdb2519/results/mdb-2519/feed.bytes
          unzip -l benchmark/md-tuned-mdb2519/mdb-2519.zip | tail -n 1 | tee benchmark/md-tuned-mdb2519/results/mdb-2519/unzip-total.txt

      - name: Run MobilityData with 12 GiB heap
        shell: bash
        run: |
          set +e
          OUT="$PWD/benchmark/md-tuned-mdb2519/results/mdb-2519/mobilitydata-xmx12g"
          FEED="$PWD/benchmark/md-tuned-mdb2519/mdb-2519.zip"
          mkdir -p "$OUT"
          /usr/bin/time -v -o "$OUT/time.txt" \
            timeout --signal=TERM --kill-after=10s 1800s \
            java -Xmx12g -jar benchmark/md-tuned-mdb2519/mobilitydata-cli.jar \
              -i "$FEED" -o "$OUT" -d 2026-08-07 \
            >"$OUT/stdout.txt" 2>"$OUT/stderr.txt"
          code=$?
          echo "$code" | tee "$OUT/exit-code.txt"
          if [[ -f "$OUT/system_errors.json" ]]; then
            cp "$OUT/system_errors.json" "$OUT/system_errors.preserved.json"
          fi
          exit 0

      - name: Summarize
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          d=Path('benchmark/md-tuned-mdb2519/results/mdb-2519/mobilitydata-xmx12g')
          out={}
          try: out['exit_code']=int((d/'exit-code.txt').read_text().strip())
          except Exception: out['exit_code']=None
          if (d/'time.txt').exists():
              t=(d/'time.txt').read_text(errors='replace')
              pats={
                'elapsed': r'Elapsed \(wall clock\) time.*?:\s*(.+)$',
                'max_rss_kb': r'Maximum resident set size \(kbytes\):\s*(\d+)',
                'user_s': r'User time \(seconds\):\s*(.+)$',
                'system_s': r'System time \(seconds\):\s*(.+)$',
              }
              for k,p in pats.items():
                  m=re.search(p,t,re.M)
                  if m: out[k]=m.group(1).strip()
          for name in ('report.json','system_errors.json','system_errors.preserved.json'):
              p=d/name
              if p.exists(): out[name]={'bytes':p.stat().st_size}
          se=d/'system_errors.json'
          if se.exists():
              try: out['system_errors']=json.loads(se.read_text())
              except Exception: out['system_errors_parse_error']=True
          (d/'summary.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobilitydata-mdb2519-xmx12g-results
          path: benchmark/md-tuned-mdb2519/results/
          retention-days: 7
