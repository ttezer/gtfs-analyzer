name: R package

# Checks the gtfsanalyzer R package (r/) against a CLI built from the same commit.
# Runs only when the package or the engine that produces its JSON input changes, so the
# main CI is not slowed down.
on:
  push:
    branches: [main]
    paths:
      - 'r/**'
      - 'crates/**'
      - 'Cargo.lock'
      - '.github/workflows/r.yml'
  pull_request:
    branches: [main]
    paths:
      - 'r/**'
      - 'crates/**'
      - 'Cargo.lock'
      - '.github/workflows/r.yml'

permissions:
  contents: read

concurrency:
  group: r-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r-cmd-check:
    name: R CMD check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Every job needs a timeout (see ci.yml). Normal: build ~5 min + check ~2 min.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CARGO_INCREMENTAL: 0
      R_KEEP_PKG_SOURCE: yes
      # Tests that need the CLI fail instead of skipping when it cannot be found.
      # Without this, a wrong path skipped every analysis test on Windows and the
      # job still passed (2026-11-26).
      GTFSANALYZER_REQUIRE_BINARY: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # Read-only: reuses the main CI's cargo cache where one exists and never writes,
      # so this workflow adds nothing to the repository's cache quota.
      - name: Cargo cache (read)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build the CLI
        shell: bash
        run: |
          cargo build -p gtfs-analyzer
          BIN="$PWD/target/debug/gtfs-analyzer"
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Git Bash gives /d/a/...; R on Windows needs D:\a\...
            BIN="$(cygpath -w "$BIN.exe")"
          fi
          "$BIN" --version
          echo "GTFS_ANALYZER_BIN=$BIN" >> "$GITHUB_ENV"

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck
          needs: check

      # Tests run against the CLI built above (GTFS_ANALYZER_BIN); no network access is
      # needed. Warnings fail the job, as they would block a CRAN submission.
      - uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          working-directory: r
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
