name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; the deploy job widens its own scope below.
permissions:
  contents: read

jobs:
  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain kur
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo test
        run: cargo test --workspace

      # issue #91: clippy borcu çözüldüğü için tüm target'lar için warnings blocking.
      # `--all-targets`, test/example lintlerini de kapsar; tek crate'de erken durup
      # diğer workspace uyarılarını gizlememesi için workspace kapsamı korunur.
      - name: cargo clippy (warnings blocking)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Spec kapsam raporu (WP-3/B). KAPI DEĞİL: hüküm sayısı ile kural sayısını
      # doğrudan karşılaştırmak semantik olarak güvenilir değil, o yüzden testin
      # kendisi `#[ignore]`. Ama ignored kaldığı için unutulmasın diye her koşuda
      # üretilip artifact olarak saklanır — sürüm öncesi/manuel denetimde okunur.
      # 🔴 ROZET KAPISI (2026-08-06 dış denetiminde eklendi). Denetçi haklıydı:
      # `badge_status.py` CI'da HİÇ koşmuyordu ve bu risk teorik değildi — betik bir kez
      # syntax hatasıyla ana dala gitti, bir sonraki commit'te düzeltildi (`4ff03419`).
      # Betik adjudike edilmemiş hüküm bulursa exit 1 döner; artık CI'ı da kırar.
      # issue #83: katalog kimliği çakışırsa üretim DURMALI. Ağ istemez; çakışma yolunu
      # zorlayıp fail-closed olduğunu kanıtlar. Kapıyı yazmak kurmak değildir.
      - name: Hüküm kimliği çakışması fail-closed mı (extract_provisions --selftest)
        run: |
          python3 spec-audit/extract_provisions.py --selftest

      # issue #81: modalsiz taramanın normatif saydığı bir kalıp katalogda YOKSA ya da
      # neden olmadığı yazılı değilse, o boşluk sessizdir. Ağ istemez.
      # issue #82: ISO 4217 tablosu ÜRETİLMİŞTİR; kaynağa karşı sürüklenme denetimi.
      # ⚠️ Ağ ister. Kaynağa ulaşılamazsa exit 2 döner ve iş KIRMIZI olur — "drift yok" ile
      # "bakılamadı" karıştırılmaz (`spec_drift.py` ile aynı ders).
      - name: ISO 4217 sürüklenme denetimi
        run: |
          python3 spec-audit/gen_iso4217.py --check

      # issue #79: HTML entity tablosu da üretilmiştir.
      # issue #79: eleman listesi de üretilmiştir (dizin + gerekçeli iki ek küme).
      - name: HTML eleman sürüklenme denetimi
        run: |
          python3 spec-audit/gen_html_elements.py --check

      - name: HTML entity sürüklenme denetimi
        run: |
          python3 spec-audit/gen_html_entities.py --check

      # issue #82: RFC 5646 grandfathered etiketleri IANA kayıt defterinden üretilir.
      - name: BCP 47 grandfathered sürüklenme denetimi
        run: |
          python3 spec-audit/gen_bcp47_grandfathered.py --check

      - name: Sinyal paritesi (signal_parity)
        run: |
          python3 spec-audit/signal_parity.py

      # issue #111: MobilityData eşlemeleri generic notice kodlarını alan/dosya
      # bağlamıyla çözmeli; mapping'de olmayan registry/docs paritesi sessizce
      # MD-only görünmemeli.
      - name: MobilityData parity mapping drift
        run: |
          python3 spec-audit/check_md_parity_mapping.py
          python3 spec-audit/test_md_parity_audit.py

      - name: Spec rozeti kapısı (badge_status)
        run: |
          python3 spec-audit/badge_status.py

      # `|| true`: rapor bir kapı DEĞİLDİR, düşmesi CI'ı kırmamalı.
      # ⚠️ Bu bilinçli: alan-tablosu kapsamı 300/300 "çapa" ölçüsüdür, semantik tamlık
      # değil (bkz. EVIDENCE_BASE.md §5.4). Zorunlu kapı yapmak ölçmediği bir şeyi
      # garanti ediyormuş gibi gösterirdi. Rozet kapısı YUKARIDA ve o gerçek kapıdır.
      - name: Spec kapsam raporu üret
        if: always()
        run: |
          mkdir -p spec-audit-report
          {
            echo "# Spec kapsam raporu — $(git rev-parse --short HEAD) — $(date -u +%FT%TZ)"
            echo
            cargo test -p gtfs-pipeline --test emit_proof spec_partial_coverage_report \
              -- --ignored --nocapture 2>&1 | grep -v '^\[timing\]' || true
            echo
            echo "## A defteri (spec_coverage_ledger.txt)"
            cat crates/pipeline/tests/spec_coverage_ledger.txt
          } > spec-audit-report/spec-coverage.txt
          cat spec-audit-report/spec-coverage.txt

      - name: Spec kapsam raporu artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spec-audit-report
          path: spec-audit-report/
          if-no-files-found: warn

  ts-test:
    name: TypeScript Unit Tests + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Node.js kur
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: npm bağımlılıkları yükle
        working-directory: ui
        run: npm ci

      # NOT: tsc burada çalıştırılamaz — src/wasm.ts ../pkg/* (wasm-pack çıktısı, git'te
      # izlenmez) import eder; bu job wasm build etmez. Tip kontrolü build-wasm job'undaki
      # `npm run build` adımında yapılır (`tsc --noEmit && vite build`, pkg mevcutken).
      - name: vitest + coverage (eşik altındaysa fail)
        working-directory: ui
        run: npm run test:coverage

      - name: Coverage & JUnit artefaktları
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ts-coverage
          path: |
            ui/coverage/
            ui/test-results/vitest-junit.xml
          if-no-files-found: ignore

  # WASM + UI tek kez derlenir; çıktı (ui/dist) artifact olarak e2e ve deploy job'larına
  # aktarılır. Böylece aynı wasm iki ayrı runner'da tekrar derlenmez.
  build-wasm:
    name: WASM + UI Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain + wasm32 target kur
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-wasm-

      - name: wasm-pack kur
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Node.js kur
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: npm bağımlılıkları yükle
        working-directory: ui
        run: npm ci

      - name: WASM derle (seri — varsayılan, ui/pkg/)
        working-directory: ui
        run: npm run wasm

      - name: Nightly toolchain (threaded WASM / build-std için)
        run: |
          rustup toolchain install nightly --component rust-src --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain nightly

      - name: Threaded WASM derle (ui/pkg-threads/ — UI build bunu dinamik import eder)
        working-directory: ui
        run: npm run wasm:threads

      - name: wasm-bindgen CLI kur (Memory64)
        run: cargo install wasm-bindgen-cli --version 0.2.121 --locked

      - name: Memory64 WASM derle (ui/pkg64/)
        working-directory: ui
        run: npm run wasm:64

      - name: wasm32 / wasm64 deterministik çıktı eşitliği
        working-directory: ui
        run: npm run wasm:64:parity

      - name: UI derle (taze ui/dist)
        working-directory: ui
        run: npm run build

      - name: ui/dist artifact yükle (e2e + deploy bunu tüketir)
        uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: ui/dist
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: E2E (Playwright)
    needs: build-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Node.js kur
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: npm bağımlılıkları yükle
        working-directory: ui
        run: npm ci

      # wasm yeniden derlenmez: build-wasm'ın ürettiği ui/dist indirilir; vite preview onu sunar.
      - name: ui/dist artifact indir
        uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ui/dist

      - name: Playwright browser cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('ui/package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Playwright browser kur
        working-directory: ui
        run: npx playwright install chromium --with-deps

      - name: E2E testleri çalıştır
        working-directory: ui
        run: npx playwright test

      - name: E2E rapor & sonuç artefaktları
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            ui/playwright-report/
            ui/test-results/
          if-no-files-found: ignore

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain kur
        uses: dtolnay/rust-toolchain@stable

      # Prebuilt binary indir (kaynaktan derleme yerine; ~dakikalar tasarruf).
      - name: cargo-audit kur
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Ağ hatasını gerçek bulgudan AYIRIR: cargo-audit geçerli JSON ürettiyse tarama
      # gerçekten koştu (bulgu varsa fail). JSON üretemediyse advisory-db'ye ulaşılamamıştır
      # → 3 denemeye kadar tekrar; sonrasında uyarı basılır ama job kırmızı yanmaz
      # (ağa ulaşamamak zafiyet kanıtı değildir; sonraki push'ta yeniden denenir).
      - name: cargo audit (Rust bağımlılıkları — RustSec, ağ hatasına dayanıklı)
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            cargo audit --json > cargo-audit.json 2> cargo-audit.err
            code=$?
            # Kriter bilinçli olarak GENİŞ: "stdout geçerli JSON mu?". cargo-audit ağ hatasında
            # stdout'a JSON basmaz (stderr'e insan-okunur hata yazar), dolayısıyla JSON varsa
            # tarama koşmuştur. Şema alan adına (`vulnerabilities`) bağlanmıyoruz: alan adı
            # değişirse temiz koşu yanlışlıkla "ağ hatası" sayılır ve kapı SESSİZCE atlanırdı.
            # Bu kriterle yanılma yönü güvenli taraftadır (fail eder, sessizce geçmez).
            if jq -e . cargo-audit.json > /dev/null 2>&1; then
              if [ "$code" -ne 0 ]; then
                echo "::error::cargo audit gerçek bulgu raporladı (ağ hatası değil)."
                cat cargo-audit.err || true
                jq '.vulnerabilities' cargo-audit.json || true
                exit 1
              fi
              echo "cargo audit temiz (deneme $attempt)."
              exit 0
            fi
            echo "::notice::cargo audit advisory veritabanına ulaşamadı (deneme $attempt/3):"
            cat cargo-audit.err || true
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          echo "::warning::cargo audit 3 denemede de advisory veritabanına ulaşamadı — AĞ HATASI, zafiyet kanıtı DEĞİL. Tarama yapılamadı, adım atlandı."
          echo "⚠️ **cargo audit koşamadı**: advisory veritabanına 3 denemede de ulaşılamadı (ağ). Rust bağımlılıkları bu koşuda TARANMADI." >> "$GITHUB_STEP_SUMMARY"

      - name: Node.js kur
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      # Üretim (runtime) bağımlılıkları → BLOCKING. Deploy edilen statik sitenin npm runtime
      # bağımlılığı olmadığından bu adım bugün temiz geçer; ama ileride eklenecek bir runtime
      # açığı CI'ı kırar — gerçek güvenlik kapısı budur. (cargo audit shipped Rust deps → blocking.)
      # Ağ hatasını gerçek bulgudan AYIRIR (2026-07-29'da `advisories/bulk → ECONNRESET`
      # ana dalı kırmızı yakmıştı): npm audit --json `.metadata.vulnerabilities` ürettiyse
      # tarama gerçekten koştu → exit code'a güven (high/critical → fail). Üretemediyse
      # (`.error` döner) registry'ye ulaşılamamıştır → 3 denemeye kadar tekrar; sonrasında
      # uyarı basılır ama job kırmızı yanmaz. Rerun ihtiyacı böylece ortadan kalkar.
      - name: npm audit (üretim bağımlılıkları — blocking, ağ hatasına dayanıklı)
        working-directory: ui
        run: |
          set -uo pipefail
          mkdir -p audit
          for attempt in 1 2 3; do
            npm audit --omit=dev --audit-level=high --json > audit/npm-audit-prod.json 2> audit/npm-audit-prod.err
            code=$?
            if jq -e '.metadata.vulnerabilities' audit/npm-audit-prod.json > /dev/null 2>&1; then
              if [ "$code" -ne 0 ]; then
                echo "::error::npm audit üretim bağımlılıklarında high/critical açık buldu (ağ hatası değil)."
                npm audit --omit=dev --audit-level=high || true
                exit 1
              fi
              echo "npm audit (üretim) temiz (deneme $attempt)."
              exit 0
            fi
            echo "::notice::npm audit registry advisory endpoint'ine ulaşamadı (deneme $attempt/3):"
            jq -r '.error | "\(.code // "?"): \(.summary // "?")"' audit/npm-audit-prod.json 2>/dev/null || true
            cat audit/npm-audit-prod.err || true
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          echo "::warning::npm audit 3 denemede de registry advisory endpoint'ine ulaşamadı — AĞ HATASI, zafiyet kanıtı DEĞİL. Tarama yapılamadı, adım atlandı."
          echo "⚠️ **npm audit (üretim) koşamadı**: registry advisory endpoint'ine 3 denemede de ulaşılamadı (ağ). Üretim bağımlılıkları bu koşuda TARANMADI." >> "$GITHUB_STEP_SUMMARY"

      # Dev/build araç zinciri bulguları → NON-BLOCKING. Bunlar yalnızca lokal dev/build'i
      # etkiler (Vitest/esbuild/vite dev-server); deploy edilen statik artefakt etkilenmez.
      # Vitest/Vite major upgrade'i ayrı bir iş — takip: https://github.com/ttezer/gtfs-analyzer/issues/2
      # Rapor JSON+metin olarak artefakta yazılır; loglarda kaybolmaz.
      - name: npm audit (tüm bağımlılıklar — rapor + artefakt, non-blocking)
        working-directory: ui
        continue-on-error: true
        run: |
          mkdir -p audit
          npm audit --audit-level=high | tee audit/npm-audit.txt || true
          npm audit --json > audit/npm-audit.json || true

      - name: Audit raporu artefaktı
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit
          path: ui/audit/
          if-no-files-found: ignore

  rust-coverage:
    name: Rust Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain kur
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-tarpaulin-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-tarpaulin-

      # Prebuilt binary indir (kaynaktan derleme yerine; ~dakikalar tasarruf).
      - name: cargo-tarpaulin kur
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin

      # wasm crate'i host'ta derlenemediği için hariç tutulur.
      # Gerçek baseline (ilk CI): %70.14. Eşik mevcut oranın altına (65) konumlandı; ratchet ile yükseltilir.
      # --engine llvm: varsayılan ptrace motoru bazı testlerde segfault veriyordu (safe Rust kaynaklı
      # değil; LLVM source-based coverage ptrace kullanmaz ve kararlıdır). llvm-tools-preview gerekir.
      - name: cargo tarpaulin (eşik altındaysa fail)
        run: cargo tarpaulin --engine llvm --workspace --exclude gtfs-wasm --out Html --out Lcov --output-dir coverage --fail-under 65 --timeout 300

      - name: Rust coverage artefaktı
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: coverage/
          if-no-files-found: ignore

  # GitHub Pages deploy — yalnız main'e push'ta. build-wasm'ın ürettiği ui/dist artifact'ını
  # kaynaktan-taze olarak deploy eder (committed dist yok; drift imkânsız).
  deploy:
    name: Deploy
    needs: build-wasm
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write   # mükerrer github-pages artifact'ını silmek için
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: ui/dist artifact indir
        uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ui/dist

      # Re-run'larda upload-pages-artifact yeni bir "github-pages" artifact'ı ekler ama
      # eskisini silmez → run içinde 2 tane olur → deploy-pages@v5 "Multiple artifacts
      # named github-pages" ile patlar. Upload'tan önce mevcut olan(lar)ı temizle.
      - name: Eski github-pages artifact'ını temizle
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts \
            --jq '.artifacts[] | select(.name=="github-pages") | .id' \
            | xargs -r -I{} gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/{}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ui/dist

      - id: deploy
        uses: actions/deploy-pages@v5
