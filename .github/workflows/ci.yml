name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; the deploy job widens its own scope below.
permissions:
  contents: read

jobs:
  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain kur
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo test
        run: cargo test --workspace

  ts-test:
    name: TypeScript Unit Tests + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Node.js kur
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: npm bağımlılıkları yükle
        working-directory: ui
        run: npm ci

      # NOT: tsc burada çalıştırılamaz — src/wasm.ts ../pkg/* (wasm-pack çıktısı, git'te
      # izlenmez) import eder; bu job wasm build etmez. Tip kontrolü build-wasm job'undaki
      # `npm run build` adımında yapılır (`tsc --noEmit && vite build`, pkg mevcutken).
      - name: vitest + coverage (eşik altındaysa fail)
        working-directory: ui
        run: npm run test:coverage

      - name: Coverage & JUnit artefaktları
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ts-coverage
          path: |
            ui/coverage/
            ui/test-results/vitest-junit.xml
          if-no-files-found: ignore

  # WASM + UI tek kez derlenir; çıktı (ui/dist) artifact olarak e2e ve deploy job'larına
  # aktarılır. Böylece aynı wasm iki ayrı runner'da tekrar derlenmez.
  build-wasm:
    name: WASM + UI Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain + wasm32 target kur
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-wasm-

      - name: wasm-pack kur
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Node.js kur
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: npm bağımlılıkları yükle
        working-directory: ui
        run: npm ci

      - name: WASM derle (seri — varsayılan, ui/pkg/)
        working-directory: ui
        run: npm run wasm

      - name: Nightly toolchain (threaded WASM / build-std için)
        run: |
          rustup toolchain install nightly --component rust-src --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain nightly

      - name: Threaded WASM derle (ui/pkg-threads/ — UI build bunu dinamik import eder)
        working-directory: ui
        run: npm run wasm:threads

      - name: wasm-bindgen CLI kur (Memory64)
        run: cargo install wasm-bindgen-cli --version 0.2.121 --locked

      - name: Memory64 WASM derle (ui/pkg64/)
        working-directory: ui
        run: npm run wasm:64

      - name: wasm32 / wasm64 deterministik çıktı eşitliği
        working-directory: ui
        run: npm run wasm:64:parity

      - name: UI derle (taze ui/dist)
        working-directory: ui
        run: npm run build

      - name: ui/dist artifact yükle (e2e + deploy bunu tüketir)
        uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: ui/dist
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: E2E (Playwright)
    needs: build-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Node.js kur
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: npm bağımlılıkları yükle
        working-directory: ui
        run: npm ci

      # wasm yeniden derlenmez: build-wasm'ın ürettiği ui/dist indirilir; vite preview onu sunar.
      - name: ui/dist artifact indir
        uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ui/dist

      - name: Playwright browser cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('ui/package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Playwright browser kur
        working-directory: ui
        run: npx playwright install chromium --with-deps

      - name: E2E testleri çalıştır
        working-directory: ui
        run: npx playwright test

      - name: E2E rapor & sonuç artefaktları
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            ui/playwright-report/
            ui/test-results/
          if-no-files-found: ignore

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain kur
        uses: dtolnay/rust-toolchain@stable

      # Prebuilt binary indir (kaynaktan derleme yerine; ~dakikalar tasarruf).
      - name: cargo-audit kur
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit (Rust bağımlılıkları — RustSec)
        run: cargo audit

      - name: Node.js kur
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      # Üretim (runtime) bağımlılıkları → BLOCKING. Deploy edilen statik sitenin npm runtime
      # bağımlılığı olmadığından bu adım bugün temiz geçer; ama ileride eklenecek bir runtime
      # açığı CI'ı kırar — gerçek güvenlik kapısı budur. (cargo audit shipped Rust deps → blocking.)
      - name: npm audit (üretim bağımlılıkları — blocking)
        working-directory: ui
        run: npm audit --omit=dev --audit-level=high

      # Dev/build araç zinciri bulguları → NON-BLOCKING. Bunlar yalnızca lokal dev/build'i
      # etkiler (Vitest/esbuild/vite dev-server); deploy edilen statik artefakt etkilenmez.
      # Vitest/Vite major upgrade'i ayrı bir iş — takip: https://github.com/ttezer/gtfs-analyzer/issues/2
      # Rapor JSON+metin olarak artefakta yazılır; loglarda kaybolmaz.
      - name: npm audit (tüm bağımlılıklar — rapor + artefakt, non-blocking)
        working-directory: ui
        continue-on-error: true
        run: |
          mkdir -p audit
          npm audit --audit-level=high | tee audit/npm-audit.txt || true
          npm audit --json > audit/npm-audit.json || true

      - name: Audit raporu artefaktı
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit
          path: ui/audit/
          if-no-files-found: ignore

  rust-coverage:
    name: Rust Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain kur
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-tarpaulin-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-tarpaulin-

      # Prebuilt binary indir (kaynaktan derleme yerine; ~dakikalar tasarruf).
      - name: cargo-tarpaulin kur
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin

      # wasm crate'i host'ta derlenemediği için hariç tutulur.
      # Gerçek baseline (ilk CI): %70.14. Eşik mevcut oranın altına (65) konumlandı; ratchet ile yükseltilir.
      # --engine llvm: varsayılan ptrace motoru bazı testlerde segfault veriyordu (safe Rust kaynaklı
      # değil; LLVM source-based coverage ptrace kullanmaz ve kararlıdır). llvm-tools-preview gerekir.
      - name: cargo tarpaulin (eşik altındaysa fail)
        run: cargo tarpaulin --engine llvm --workspace --exclude gtfs-wasm --out Html --out Lcov --output-dir coverage --fail-under 65 --timeout 300

      - name: Rust coverage artefaktı
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: coverage/
          if-no-files-found: ignore

  # GitHub Pages deploy — yalnız main'e push'ta. build-wasm'ın ürettiği ui/dist artifact'ını
  # kaynaktan-taze olarak deploy eder (committed dist yok; drift imkânsız).
  deploy:
    name: Deploy
    needs: build-wasm
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write   # mükerrer github-pages artifact'ını silmek için
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: ui/dist artifact indir
        uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ui/dist

      # Re-run'larda upload-pages-artifact yeni bir "github-pages" artifact'ı ekler ama
      # eskisini silmez → run içinde 2 tane olur → deploy-pages@v5 "Multiple artifacts
      # named github-pages" ile patlar. Upload'tan önce mevcut olan(lar)ı temizle.
      - name: Eski github-pages artifact'ını temizle
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts \
            --jq '.artifacts[] | select(.name=="github-pages") | .id' \
            | xargs -r -I{} gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/{}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ui/dist

      - id: deploy
        uses: actions/deploy-pages@v5
