name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; the deploy job widens its own scope below.
permissions:
  contents: read

# 🔴 Every job MUST have `timeout-minutes`. None did, and we saw the cost on 2026-08-19:
# `e2e` normally takes 72 seconds, but it hung in three consecutive runs and occupied a
# runner until GitHub's six-hour default timeout. No job turned RED — all three runs stayed
# stuck as "in_progress", so the result was neither green nor red. An unlimited job cannot
# FAIL; it can only wait. This is the CI equivalent of the "silently return None" pattern
# caught repeatedly in this repository.
# The values have generous margins over normal duration. They exist to TURN A HANG INTO AN
# ERROR ON TIME, not to make the limits tighter.
#
# Shared setup lives under `.github/actions/`: `setup-node-deps` (Node + npm ci) and
# `setup-rust-wasm` (stable + wasm32, cargo cache, wasm-pack, nightly). Node, wasm-pack
# versions and the action SHAs for these steps are kept ONLY there.
jobs:
  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20   # normal: Rust Tests ~2dk
    # The incremental build cache (target/debug/incremental) is useless in CI: every run
    # starts on a clean runner. It was still cached and bloated the cache (2026-09-23:
    # Linux-cargo reached 4.7 GB); splitting the WASM caches into three exceeded the
    # repository's 10 GB quota, so GitHub evicted this cache.
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # The cache is READ on every run but WRITTEN only on a push to main with a new key
      # (the final two steps). PRs used to write their own copies, and restore-keys moved
      # the old target to the new key, accumulating test programs from previous builds on
      # every Cargo.lock change (2026-10-30, Linux-cargo: 1.07 → 1.45 → 1.87 GB). Every
      # run downloaded that data until the account's cache-download quota was exhausted.
      # Before writing, outputs from our own packages are removed; only compiled
      # dependencies are kept.
      - name: Cargo cache (read)
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo test
        run: cargo test --workspace

      # The SDK translator (`sdk-en`) is built only with this feature; `--workspace` does
      # not enable it and would not run its tests. The equivalence test with the CLI
      # translator runs here.
      - name: cargo test (gtfs-wasm sdk-en)
        run: cargo test -p gtfs-wasm --features sdk-en

      # issue #91: clippy debt is resolved, so warnings are blocking for all targets.
      # `--all-targets` includes test/example lints; keep workspace scope so an early stop
      # in one crate does not hide warnings in the rest of the workspace.
      - name: cargo clippy (warnings blocking)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Spec coverage report (WP-3/B). NOT A GATE: comparing provision and rule counts
      # directly is not semantically reliable, so the test itself is `#[ignore]`. It is
      # generated and stored as an artifact on every run so that it is not forgotten — it
      # is read during pre-release or manual review.
      # 🔴 BADGE GATE (added during the 2026-08-06 external audit). The reviewer was right:
      # `badge_status.py` was NEVER run in CI, and the risk was not theoretical — the script
      # reached the main branch once with a syntax error and was fixed in the next commit
      # (`4ff03419`). The script now returns exit 1 for an unadjudicated provision and breaks
      # CI as well.
      # issue #83: production MUST STOP if catalog identities collide. No network is needed;
      # force the collision path to prove that it fails closed. Writing a gate is not
      # the same as installing it.
      - name: Check provision identity collision fails closed (extract_provisions --selftest)
        run: |
          python3 spec-audit/extract_provisions.py --selftest

      # issue #81: if a pattern that the modal-free audit treats as normative is missing
      # from the catalog, or its absence is undocumented, the gap is silent. No network.
      # issue #82: the ISO 4217 table is GENERATED; check it for drift against its source.
      # ⚠️ This check needs the network. If the source is unreachable, it returns exit 2 and
      # the job turns RED — do not confuse "no drift" with "could not inspect" (the same
      # lesson as `spec_drift.py`).
      - name: Check ISO 4217 drift
        run: |
          python3 spec-audit/gen_iso4217.py --check

      # issue #79: the HTML entity table is generated too.
      # issue #79: the element list is also generated (the index plus two justified sets).
      - name: Check HTML element drift
        run: |
          python3 spec-audit/gen_html_elements.py --check

      - name: Check HTML entity drift
        run: |
          python3 spec-audit/gen_html_entities.py --check

      # issue #82: RFC 5646 grandfathered tags are generated from the IANA registry.
      - name: Check BCP 47 grandfathered drift
        run: |
          python3 spec-audit/gen_bcp47_grandfathered.py --check

      # Translatable field types are generated from `spec-audit/spec_fields.json`; TRN_011
      # queries that table. Because the source is local, this step NEEDS NO NETWORK.
      - name: Check translatable-field table drift
        run: |
          python3 spec-audit/gen_translatable_fields.py --check

      - name: Sinyal paritesi (signal_parity)
        run: |
          python3 spec-audit/signal_parity.py

      # issue #111: MobilityData mappings must resolve generic notice codes with field/file
      # context; registry/docs parity missing from the mapping must not silently appear as
      # MD-only.
      - name: MobilityData parity mapping drift
        run: |
          python3 spec-audit/check_md_parity_mapping.py
          python3 spec-audit/test_md_parity_audit.py

      - name: Spec badge gate (badge_status)
        run: |
          python3 spec-audit/test_badge_status.py
          python3 spec-audit/badge_status.py

      # The denominator for the GTFS-JP 100% badge is the MLIT provision inventory; the gate
      # stays closed until strong, machine-checkable soft provisions are linked to a rule in
      # the registry.
      - name: GTFS-JP automatic coverage inventory
        run: |
          python3 spec-audit/check_gtfs_jp_coverage.py
          python3 spec-audit/test_gtfs_jp_coverage.py

      # 🔴 No workflow called these tests until 2026-08-18. `test_timing.py`, which encoded
      # the lesson from #149 (an empty measurement column), was written and left dead; the
      # runner was less tested than the product it measured, and three consecutive headline
      # numbers came from the TOOL rather than the product (#159).
      - name: Corpus-tool gates (audit_all)
        run: |
          python3 -m py_compile benchmark/audit_all/*.py
          python3 benchmark/audit_all/test_timing.py

      # `|| true`: the report is NOT a gate, so its failure must not break CI.
      # ⚠️ This is deliberate: field-table coverage is a 300/300 "anchor" measurement,
      # not semantic completeness (see EVIDENCE_BASE.md §5.4). Making it a required gate
      # would pretend to guarantee something it does not measure. The badge gate ABOVE is
      # the real gate.
      - name: Generate spec coverage report
        if: always()
        run: |
          mkdir -p spec-audit-report
          {
            echo "# Spec kapsam raporu — $(git rev-parse --short HEAD) — $(date -u +%FT%TZ)"
            echo
            cargo test -p gtfs-pipeline --test emit_proof spec_partial_coverage_report \
              -- --ignored --nocapture 2>&1 | grep -v '^\[timing\]' || true
            echo
            echo "## A defteri (spec_coverage_ledger.txt)"
            cat crates/pipeline/tests/spec_coverage_ledger.txt
          } > spec-audit-report/spec-coverage.txt
          cat spec-audit-report/spec-coverage.txt

      - name: Upload spec coverage report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: spec-audit-report
          path: spec-audit-report/
          if-no-files-found: warn

      - name: Cargo cache — remove our package outputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        run: cargo clean -p gtfs-analyzer -p gtfs-analyzer-python -p gtfs-config -p gtfs-core -p gtfs-pipeline -p gtfs-rules -p gtfs-wasm

      - name: Cargo cache (yaz)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  ts-test:
    name: TypeScript Unit Tests + Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10   # normal: TS ~30sn
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-node-deps

      # NOTE: tsc cannot run here — src/wasm.ts imports ../pkg/* (wasm-pack output, not
      # tracked in git), and this job does not build WASM. Type checking happens in the
      # `npm run build` step of build-wasm (`tsc --noEmit && vite build`, with pkg present).

      # `crates/core/locales/*.json` is DERIVED from the TS locales; without the export, the
      # CLI publishes stale text. There are three derived files (en/ja/fr), so gate it here.
      - name: "locale export drift (if stale: npm run locales:export)"
        working-directory: ui
        run: npm run locales:export -- --check

      - name: "GTFS-JP coverage inventory drift"
        working-directory: ui
        run: npm run gtfs-jp:coverage -- --check

      - name: vitest + coverage (fail below threshold)
        working-directory: ui
        run: npm run test:coverage

      - name: Coverage & JUnit artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ts-coverage
          path: |
            ui/coverage/
            ui/test-results/vitest-junit.xml
          if-no-files-found: ignore

  # The SDK builds two engines. wasm32 (`sdk-test`) and wasm64 (`sdk-wasm64`) build in
  # PARALLEL: when built sequentially in one job, the SDK job grew from 4.3 to 6.0 minutes
  # and lengthened the critical path to the UI build/deploy (2026-10-30). The wasm64 engine
  # tests and package gate run in `sdk-wasm64-test`, which combines both outputs alongside
  # the UI build.
  sdk-test:
    name: SDK Build + Smoke (wasm32)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-rust-wasm
        with:
          wasm-pack: 'true'

      - uses: ./.github/actions/setup-node-deps
        with:
          directory: sdk

      # wasm-opt comes from sdk's devDependency `binaryen` (exact version + lockfile
      # integrity, installed by `npm ci` above); `npm run` puts node_modules/.bin on PATH.

      # Build only wasm32; the GTFS_SDK_ENGINE tests pin this engine.
      - name: SDK smoke (wasm32 engine)
        working-directory: sdk
        env:
          SDK_WASM_TARGETS: wasm32
          GTFS_SDK_ENGINE: wasm32
        run: npm run test:config-parity && npm run test:smoke

      # The UI build (build-wasm job) packages this WASM; do not build it a second time.
      - name: Upload sdk/pkg artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sdk-pkg
          path: sdk/pkg
          if-no-files-found: error
          retention-days: 1

  sdk-wasm64:
    name: SDK wasm64 build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The wasm64 engine for large feeds: nightly build-std + wasm-bindgen
      # (the same path as ui/pkg64; see the `wasm64` job).
      - uses: ./.github/actions/setup-rust-wasm
        with:
          nightly: 'true'

      - uses: ./.github/actions/setup-node-deps
        with:
          directory: sdk

      # Read the version from Cargo.lock; the same step in the `wasm64` job explains why.
      - name: Read wasm-bindgen version from Cargo.lock
        run: |
          set -uo pipefail
          VER=$(grep -A 1 '^name = "wasm-bindgen"$' Cargo.lock \
                | grep '^version' | head -1 | cut -d'"' -f2)
          if [ -z "$VER" ]; then
            echo "::error::wasm-bindgen sürümü Cargo.lock'tan okunamadı."
            exit 1
          fi
          echo "WBG_VER=$VER" >> "$GITHUB_ENV"

      - name: Install wasm-bindgen CLI (SDK wasm64 — version from Cargo.lock)
        uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2
        with:
          tool: wasm-bindgen-cli@${{ env.WBG_VER }}

      - name: Build SDK wasm64 (sdk/pkg64)
        working-directory: sdk
        env:
          SDK_WASM_TARGETS: wasm64
        run: npm run wasm:build

      - name: Upload sdk/pkg64 artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sdk-pkg64
          path: sdk/pkg64
          if-no-files-found: error
          retention-days: 1

  sdk-wasm64-test:
    name: SDK Smoke (wasm64) + package
    needs: [sdk-test, sdk-wasm64]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-node-deps
        with:
          directory: sdk

      - name: Download sdk/pkg artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sdk-pkg
          path: sdk/pkg

      - name: Download sdk/pkg64 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sdk-pkg64
          path: sdk/pkg64

      # Node 24 supports Memory64, so engine selection falls back to wasm64. Build dist
      # without WASM (tsc only); the package gate sees the files from both engines.
      - name: SDK smoke + parity (wasm64 engine) + package dry run
        working-directory: sdk
        run: npx tsc -p tsconfig.json && node scripts/smoke-test.mjs && node scripts/parity-test.mjs && npm run package:check

  # Three WASM variants (serial, threaded, memory64) build in PARALLEL jobs; they used to
  # run sequentially in one job and formed CI's critical path (2026-09-23 measurement:
  # 2.5 + 3.5 + 3.6 minutes serially, 12.9 minutes total). `build-wasm` now collects the
  # outputs, runs the determinism parity and UI build, and passes ui/dist to e2e and deploy.
  # The gates did not change; only the runners on which they run changed.
  wasm-serial:
    name: WASM seri (ui/pkg)
    runs-on: ubuntu-latest
    timeout-minutes: 15   # normal: ~3dk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-rust-wasm
        with:
          cache-key: wasm-serial
          wasm-pack: 'true'

      - uses: ./.github/actions/setup-node-deps

      - name: Build WASM (serial — default, ui/pkg/)
        working-directory: ui
        run: npm run wasm

      - name: Upload ui/pkg artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wasm-serial
          path: ui/pkg
          if-no-files-found: error
          retention-days: 1

  wasm-threads:
    name: WASM threaded (ui/pkg-threads)
    runs-on: ubuntu-latest
    timeout-minutes: 15   # normal: ~4dk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-rust-wasm
        with:
          cache-key: wasm-threads
          wasm-pack: 'true'
          nightly: 'true'

      - uses: ./.github/actions/setup-node-deps

      - name: Build threaded WASM (ui/pkg-threads/ — UI build imports this dynamically)
        working-directory: ui
        run: npm run wasm:threads

      - name: Upload ui/pkg-threads artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wasm-threads
          path: ui/pkg-threads
          if-no-files-found: error
          retention-days: 1

  wasm64:
    name: WASM memory64 (ui/pkg64)
    runs-on: ubuntu-latest
    timeout-minutes: 15   # normal: ~4dk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-rust-wasm
        with:
          cache-key: wasm64
          nightly: 'true'

      - uses: ./.github/actions/setup-node-deps

      # ⚠️ NEVER WRITE THE VERSION BY HAND. The wasm-bindgen CLI version MUST MATCH the
      # wasm-bindgen crate in the compiled code; if they diverge, Memory64 output is rejected
      # with a schema mismatch. A hard-coded `--version` would turn this into a manually
      # synchronized copy with no gate: if someone runs `cargo update -p wasm-bindgen` and
      # forgets this line, CI breaks from maintenance debt rather than code. The version is
      # now read from one source — Cargo.lock — so divergence is impossible.
      #
      # Installation uses a PREBUILT binary through `taiki-e/install-action` — the path the
      # repository already uses for cargo-audit and cargo-tarpaulin. Previously this step
      # compiled from SOURCE with `cargo install`, at a measured cost of 86 seconds.
      # The action has its own download retry, so no manual loop like the one in `wasm-pack`
      # is needed here; it falls back to a source build if the binary is unavailable.
      - name: Read wasm-bindgen version from Cargo.lock
        run: |
          set -uo pipefail
          # `^name = "wasm-bindgen"$` is an EXACT match: it does not capture neighboring
          # packages such as wasm-bindgen-macro / -rayon / -shared.
          VER=$(grep -A 1 '^name = "wasm-bindgen"$' Cargo.lock \
                | grep '^version' | head -1 | cut -d'"' -f2)
          if [ -z "$VER" ]; then
            echo "::error::wasm-bindgen sürümü Cargo.lock'tan okunamadı — lock biçimi değişmiş olabilir. Sabit sürüm YAZMAYIN, bu adımı düzeltin."
            exit 1
          fi
          echo "Cargo.lock'taki wasm-bindgen: $VER"
          echo "WBG_VER=$VER" >> "$GITHUB_ENV"

      - name: Install wasm-bindgen CLI (Memory64 — version from Cargo.lock)
        uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2
        with:
          tool: wasm-bindgen-cli@${{ env.WBG_VER }}

      - name: Does the wasm-bindgen version match Cargo.lock?
        run: |
          set -uo pipefail
          # If the installed CLI and compiled crate diverge, Memory64 output is rejected with
          # a schema mismatch. This proves the match regardless of the installation path.
          got=$(wasm-bindgen --version | awk '{print $2}')
          if [ "$got" != "$WBG_VER" ]; then
            echo "::error::wasm-bindgen CLI $got kuruldu ama Cargo.lock $WBG_VER diyor."
            exit 1
          fi
          echo "wasm-bindgen CLI $got = Cargo.lock $WBG_VER"

      - name: Build Memory64 WASM (ui/pkg64/)
        working-directory: ui
        run: npm run wasm:64

      - name: Upload ui/pkg64 artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wasm64
          path: ui/pkg64
          if-no-files-found: error
          retention-days: 1

  build-wasm:
    name: WASM parity + UI Build
    needs: [wasm-serial, wasm-threads, wasm64, sdk-test, sdk-wasm64]
    runs-on: ubuntu-latest
    timeout-minutes: 15   # normal: ~1-2dk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-node-deps

      - name: Download ui/pkg artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wasm-serial
          path: ui/pkg

      - name: Download ui/pkg-threads artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wasm-threads
          path: ui/pkg-threads

      - name: Download ui/pkg64 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wasm64
          path: ui/pkg64

      # The UI builds gtfs-sdk from source (sdk/src) and packages the WASM in sdk/pkg.
      # The `sdk-test` job already produces that WASM with the same script (build-wasm.mjs,
      # wasm-pack 0.15.0, binaryen 130.0.0); download it here instead of rebuilding it.
      - name: Download sdk/pkg artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sdk-pkg
          path: sdk/pkg

      - name: Download sdk/pkg64 artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sdk-pkg64
          path: sdk/pkg64

      - name: wasm32 / wasm64 deterministic output parity
        working-directory: ui
        run: npm run wasm:64:parity

      # `--ignore-scripts`: `prebuild` (npm run sdk:build) would rebuild the SDK WASM;
      # sdk/pkg was downloaded above. The actual `build` script (tsc --noEmit + vite build)
      # runs here.
      - name: Build UI (fresh ui/dist)
        working-directory: ui
        run: npm run build --ignore-scripts

      # JapanBus prototypes remain in the repository but are not copied to the Pages artifact
      # until the backend connection is complete; the temporary flow therefore stays inactive.

      - name: Upload ui/dist artifact (consumed by e2e + deploy)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ui-dist
          path: ui/dist
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: E2E (Playwright)
    needs: build-wasm
    runs-on: ubuntu-latest
    timeout-minutes: 15   # normal: E2E ~72sn
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-node-deps

      # WASM is not rebuilt: download the ui/dist produced by build-wasm; vite preview serves it.
      - name: Download ui/dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ui-dist
          path: ui/dist

      - name: Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('ui/package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      # 🔴 `--with-deps` was REMOVED (2026-08-19). That flag runs `apt-get update`, and
      # FOUR consecutive runs hung there: the log repeated `Ign:` lines for
      # `azure.archive.ubuntu.com` forever because the runner's apt mirror did not respond.
      # This was unrelated to our code, and the tests never started.
      #
      # GitHub's `ubuntu-latest` image already includes Chromium's system libraries, so the
      # apt step was unnecessary. If a library is actually missing, the browser WILL NOT
      # START and the test will fail clearly instead of hanging. The limit remains: a future
      # hang fails after six minutes instead of waiting silently.
      - name: Install Playwright browser
        timeout-minutes: 6
        working-directory: ui
        run: npx playwright install chromium

      - name: Run E2E tests
        working-directory: ui
        run: npx playwright test

      - name: E2E report & result artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            ui/playwright-report/
            ui/test-results/
          if-no-files-found: ignore

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10   # normal: Security ~32sn
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # Download a prebuilt binary instead of compiling from source; saves several minutes.
      - name: Install cargo-audit
        uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2
        with:
          tool: cargo-audit

      # DISTINGUISHES a network failure from a real finding: if cargo-audit produces valid
      # JSON, the scan really ran (and fails if it found something). If it cannot produce
      # JSON, the advisory DB was unreachable → retry up to three times; then warn without
      # turning the job red (network unavailability is not evidence of a vulnerability;
      # retry on the next push).
      - name: cargo audit (Rust dependencies — RustSec, network-resilient)
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            # The step shell is `bash -e`: a nonzero exit would otherwise end the script
            # silently here and skip the finding/network distinction below. `|| code=$?`
            # captures the exit status.
            code=0
            cargo audit --json > cargo-audit.json 2> cargo-audit.err || code=$?
            # The criterion is deliberately BROAD: "is stdout valid JSON?". On a network
            # error cargo-audit writes no JSON to stdout (it writes a human-readable error
            # to stderr), so JSON means the scan ran. We do not depend on the schema field
            # (`vulnerabilities`): if that field changed, a clean run would be misclassified
            # as a network error and the gate would be SILENTLY skipped. This criterion errs
            # on the safe side (it fails rather than passing silently).
            if jq -e . cargo-audit.json > /dev/null 2>&1; then
              if [ "$code" -ne 0 ]; then
                echo "::error::cargo audit gerçek bulgu raporladı (ağ hatası değil)."
                cat cargo-audit.err || true
                jq '.vulnerabilities' cargo-audit.json || true
                exit 1
              fi
              echo "cargo audit temiz (deneme $attempt)."
              exit 0
            fi
            echo "::notice::cargo audit advisory veritabanına ulaşamadı (deneme $attempt/3):"
            cat cargo-audit.err || true
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          echo "::warning::cargo audit 3 denemede de advisory veritabanına ulaşamadı — AĞ HATASI, zafiyet kanıtı DEĞİL. Tarama yapılamadı, adım atlandı."
          echo "⚠️ **cargo audit koşamadı**: advisory veritabanına 3 denemede de ulaşılamadı (ağ). Rust bağımlılıkları bu koşuda TARANMADI." >> "$GITHUB_STEP_SUMMARY"

      - uses: ./.github/actions/setup-node-deps
        with:
          install: 'false'

      # Production (runtime) dependencies → BLOCKING. The deployed static site has no npm
      # runtime dependency, so this is clean today; a future runtime vulnerability will
      # break CI — this is the real security gate. (cargo audit shipped Rust deps → blocking.)
      # DISTINGUISHES a network failure from a real finding (on 2026-07-29,
      # `advisories/bulk → ECONNRESET` made the main branch red): if npm audit --json produces
      # `.metadata.vulnerabilities`, the scan ran → trust the exit code (high/critical → fail).
      # If it produces `.error`, the registry was unreachable → retry up to three times; then
      # warn without turning the job red. This removes the need for a rerun just for network.
      - name: npm audit (production dependencies — blocking, network-resilient)
        working-directory: ui
        run: |
          set -uo pipefail
          mkdir -p audit
          for attempt in 1 2 3; do
            # Capture the exit status under `bash -e` (see the cargo audit step above).
            code=0
            npm audit --omit=dev --audit-level=high --json > audit/npm-audit-prod.json 2> audit/npm-audit-prod.err || code=$?
            if jq -e '.metadata.vulnerabilities' audit/npm-audit-prod.json > /dev/null 2>&1; then
              if [ "$code" -ne 0 ]; then
                echo "::error::npm audit üretim bağımlılıklarında high/critical açık buldu (ağ hatası değil)."
                npm audit --omit=dev --audit-level=high || true
                exit 1
              fi
              echo "npm audit (üretim) temiz (deneme $attempt)."
              exit 0
            fi
            echo "::notice::npm audit registry advisory endpoint'ine ulaşamadı (deneme $attempt/3):"
            jq -r '.error | "\(.code // "?"): \(.summary // "?")"' audit/npm-audit-prod.json 2>/dev/null || true
            cat audit/npm-audit-prod.err || true
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          echo "::warning::npm audit 3 denemede de registry advisory endpoint'ine ulaşamadı — AĞ HATASI, zafiyet kanıtı DEĞİL. Tarama yapılamadı, adım atlandı."
          echo "⚠️ **npm audit (üretim) koşamadı**: registry advisory endpoint'ine 3 denemede de ulaşılamadı (ağ). Üretim bağımlılıkları bu koşuda TARANMADI." >> "$GITHUB_STEP_SUMMARY"

      # Dev/build toolchain findings → NON-BLOCKING. They affect only local dev/build
      # (Vitest/esbuild/vite dev-server); the deployed static artifact is unaffected.
      # The Vitest/Vite major upgrade is a separate task — track it at
      # https://github.com/ttezer/gtfs-analyzer/issues/2
      # The report is written as JSON and text in an artifact, so it is not lost in logs.
      - name: npm audit (all dependencies — report + artifact, non-blocking)
        working-directory: ui
        continue-on-error: true
        run: |
          mkdir -p audit
          npm audit --audit-level=high | tee audit/npm-audit.txt || true
          npm audit --json > audit/npm-audit.json || true

      - name: Upload audit report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-audit
          path: ui/audit/
          if-no-files-found: ignore

  rust-coverage:
    name: Rust Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20   # normal: Coverage ~2dk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: llvm-tools-preview

      # The read/prune/write split is the same as in Rust Tests (the rationale is there).
      - name: Cargo cache (read)
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-tarpaulin-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-tarpaulin-

      # Download a prebuilt binary instead of compiling from source; saves several minutes.
      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2
        with:
          tool: cargo-tarpaulin

      # Exclude the wasm crate because it cannot be built on the host.
      # Actual baseline (first CI): 70.14%. The threshold is below the current rate (65) and
      # is raised with the ratchet.
      # --engine llvm: the default ptrace engine segfaulted in some tests (not because of
      # safe Rust; LLVM source-based coverage does not use ptrace and is stable). Requires
      # llvm-tools-preview.
      - name: cargo tarpaulin (fail below threshold)
        run: cargo tarpaulin --engine llvm --workspace --exclude gtfs-wasm --out Html --out Lcov --output-dir coverage --fail-under 65 --timeout 300

      - name: Upload Rust coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-coverage
          path: coverage/
          if-no-files-found: ignore

      - name: Cargo cache — remove our package outputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        run: cargo clean -p gtfs-analyzer -p gtfs-analyzer-python -p gtfs-config -p gtfs-core -p gtfs-pipeline -p gtfs-rules -p gtfs-wasm

      - name: Cargo cache (yaz)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  python-package:
    name: Python package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Rust tests for Python binding
        run: cargo test -p gtfs-analyzer-python

      - name: Build Python wheel
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8 # v1
        with:
          command: build
          args: --release --out dist --compatibility pypi

      - name: Install wheel in clean virtualenv
        run: |
          python3 -m venv .ci-python-venv
          . .ci-python-venv/bin/activate
          python -m pip install dist/*.whl
          python -m unittest discover -s tests -p 'test_python_api.py' -v

  # GitHub Pages deploy — only on a push to main. Deploy the ui/dist artifact produced by
  # build-wasm from a fresh checkout (no committed dist; drift is impossible).
  deploy:
    name: Deploy
    needs: [rust-test, ts-test, sdk-test, sdk-wasm64-test, build-wasm, e2e, security-audit, python-package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10   # normal: Deploy ~11sn
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write   # to delete duplicate github-pages artifacts
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: ui/dist artifact indir
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ui-dist
          path: ui/dist

      # On re-runs, upload-pages-artifact adds a new "github-pages" artifact without deleting
      # the old one → two exist in the run → deploy-pages@v5 fails with "Multiple artifacts
      # named github-pages". Remove existing artifact(s) before uploading.
      - name: Remove old github-pages artifact
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts \
            --jq '.artifacts[] | select(.name=="github-pages") | .id' \
            | xargs -r -I{} gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/{}

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ui/dist

      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
