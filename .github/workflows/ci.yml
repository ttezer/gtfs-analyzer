name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain kur
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo test
        run: cargo test --workspace

  ts-test:
    name: TypeScript Unit Tests + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: npm bağımlılıkları yükle
        working-directory: ui
        run: npm ci

      # Coverage sağlayıcıyı lockfile'ı bozmadan ekle (yerelde TLS kısıtı nedeniyle
      # package.json'a kalıcı eklenemedi; sürüm vitest major'ı ile eşleşmeli).
      - name: Coverage sağlayıcı kur (--no-save)
        working-directory: ui
        run: npm install --no-save @vitest/coverage-v8@^2.0.0

      - name: vitest + coverage (eşik altındaysa fail)
        working-directory: ui
        run: npm run test:coverage

      - name: Coverage & JUnit artefaktları
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ts-coverage
          path: |
            ui/coverage/
            ui/test-results/vitest-junit.xml
          if-no-files-found: ignore

  wasm-build:
    name: WASM Build + UI Build + E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain + wasm32 target kur
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-wasm-

      - name: wasm-pack kur
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: npm bağımlılıkları yükle
        working-directory: ui
        run: npm ci

      - name: WASM derle (seri — varsayılan, ui/pkg/)
        working-directory: ui
        run: npm run wasm

      - name: Nightly toolchain (threaded WASM / build-std için)
        run: |
          rustup toolchain install nightly --component rust-src --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain nightly

      - name: Threaded WASM derle (ui/pkg-threads/ — UI build bunu dinamik import eder)
        working-directory: ui
        run: npm run wasm:threads

      - name: UI derle
        working-directory: ui
        run: npm run build

      - name: Playwright browser kur
        working-directory: ui
        run: npx playwright install chromium --with-deps

      - name: E2E testleri çalıştır
        working-directory: ui
        run: npx playwright test

      - name: E2E rapor & sonuç artefaktları
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ui/playwright-report/
            ui/test-results/
          if-no-files-found: ignore

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain kur
        uses: dtolnay/rust-toolchain@stable

      - name: cargo-audit kur
        run: cargo install cargo-audit --locked

      - name: cargo audit (Rust bağımlılıkları — RustSec)
        run: cargo audit

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: npm audit (high/critical → fail)
        working-directory: ui
        run: npm audit --audit-level=high

  rust-coverage:
    name: Rust Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain kur
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-tarpaulin-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-tarpaulin-

      - name: cargo-tarpaulin kur
        run: cargo install cargo-tarpaulin --locked

      # wasm crate'i host'ta derlenemediği için hariç tutulur.
      # --fail-under BASELINE: ilk CI raporundaki gerçek oran görüldükten sonra ~%80'e yükseltilecek.
      - name: cargo tarpaulin (eşik altındaysa fail)
        run: cargo tarpaulin --workspace --exclude gtfs-wasm --out Html --out Lcov --output-dir coverage --fail-under 30 --timeout 300

      - name: Rust coverage artefaktı
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: coverage/
          if-no-files-found: ignore
