name: Rust + wasm32 araç zinciri
description: >
  WASM derleyen job'ların ortak kurulumu: stable + wasm32 target, isteğe bağlı cargo
  cache, wasm-pack ve nightly. Sürümler ve action SHA'ları yalnız burada tutulur.

inputs:
  cache-key:
    description: >
      Cargo cache anahtarının job'a özgü parçası (ör. wasm-serial). Boşsa cache
      kullanılmaz — sdk-test bilinçli olarak cache'siz koşar.
    default: ''
  wasm-pack:
    description: "'true' ise sabit sürüm wasm-pack kurulur"
    default: 'false'
  nightly:
    description: "'true' ise build-std için nightly + rust-src + wasm32 kurulur"
    default: 'false'

runs:
  using: composite
  steps:
    - name: Rust toolchain + wasm32 target kur
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        targets: wasm32-unknown-unknown

    - name: Cargo cache
      if: inputs.cache-key != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-${{ inputs.cache-key }}-${{ hashFiles('**/Cargo.lock') }}
        # Common key before the final segment: keep the first run from starting cold.
        restore-keys: |
          ${{ runner.os }}-${{ inputs.cache-key }}-
          ${{ runner.os }}-wasm-

    # On 2026-08-12 the main branch went red here: `curl: (56) Connection died`—
    # init.sh could not download the wasm-pack binary from the GitHub release. It was unrelated
    # to the code, and one re-run fixed it. The script has its OWN retry ("tried 5 times"), but
    # what was missing was a WAIT BETWEEN attempts; a transient outage is not overcome when
    # five attempts happen in the same seconds.
    #
    # ⚠️ This DIFFERS from the `cargo audit`/`npm audit` PATTERN: there, no network access only
    # means "the scan could not run", so the job may stay green. Here, if the tool is not installed,
    # none of the next steps (WASM build, UI build, determinism comparison) can run—a green result
    # on a network error would claim that unfinished work was done. Therefore the step goes RED if
    # all three attempts fail, with the reason written in the message.
    - name: wasm-pack kur (sabit sürüm)
      if: inputs.wasm-pack == 'true'
      uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2
      with:
        tool: wasm-pack@0.15.0

    # Nightly is pinned by DATE: undated "nightly" changes daily and can break CI independently
    # of the code. The date lives only here; scripts read it through `RUST_NIGHTLY`
    # (ui/scripts/build-wasm-threads.mjs, build-wasm64.mjs). 2026-09-30 = rustc
    # 1.101.0-nightly (5c543b0b8 2026-09-29), the version whose three WASM CI jobs passed that day.
    # When updating: change the date, then verify that all three WASM CI jobs are green.
    - name: Nightly toolchain (threaded WASM / build-std için)
      if: inputs.nightly == 'true'
      shell: bash
      env:
        NIGHTLY: nightly-2026-09-30
      run: |
        rustup toolchain install "$NIGHTLY" --component rust-src --profile minimal
        rustup target add wasm32-unknown-unknown --toolchain "$NIGHTLY"
        echo "RUST_NIGHTLY=$NIGHTLY" >> "$GITHUB_ENV"
